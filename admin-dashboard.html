<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NEAR Saboteur · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--m:#6effc0;--g:#ffcf6e;--r:#ff6b7a;--b:#6ec8ff;--ink:#e6ece9;--dim:#7d8d86;--line:rgba(255,255,255,.08);--bg:#070a09;--mono:'IBM Plex Mono',monospace;--disp:'Space Grotesk',sans-serif;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--m)}
.hidden{display:none !important}
/* login */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:380px;border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:10px;padding:26px 24px}
.lbox h1{margin:0 0 4px;font:700 22px var(--disp);letter-spacing:.12em}
.lbox p{margin:0 0 18px;color:var(--dim);font-size:13px}
/* shell */
#app{height:100%;display:grid;grid-template-columns:236px 1fr}
.side{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;background:#050807;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;margin:0 6px 14px}
.brand i{width:30px;height:30px;background:radial-gradient(circle at 35% 30%,#9dffd6,#1d6b4f);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);flex-shrink:0}
.brand b{font:700 15px var(--disp);letter-spacing:.14em}.brand small{display:block;font:10px var(--mono);color:var(--dim);letter-spacing:.14em}
.grp{font:600 9.5px var(--mono);letter-spacing:.18em;color:#4b5a54;margin:14px 10px 5px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font:500 13.5px var(--sans);color:#9fb0a8;text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.03);color:#d6e0db}
.nav.on{background:rgba(110,255,192,.1);color:#fff;box-shadow:inset 2px 0 0 var(--m)}
.nav em{margin-left:auto;font:600 10px var(--mono);font-style:normal;padding:1px 7px;border-radius:9px;background:rgba(255,107,122,.18);color:var(--r)}
.nav em.g{background:rgba(255,207,110,.15);color:var(--g)}.nav em.ok{background:rgba(110,255,192,.14);color:var(--m)}
.foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);font:11px var(--mono);color:var(--dim);line-height:1.7}
.foot b{color:var(--m);font-weight:600}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{min-height:62px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{margin:0;font:700 19px var(--disp);letter-spacing:.08em}
.top .sub{font:11.5px var(--mono);color:var(--dim)}
.top .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{font:600 11px var(--mono);padding:5px 9px;border-radius:5px;border:1px solid var(--line);color:#b8c4bf;white-space:nowrap}
.pill.live{border-color:rgba(110,255,192,.4);color:var(--m)}.pill.main{border-color:rgba(255,207,110,.5);color:var(--g)}
.upd{font:10.5px var(--mono);color:#4b5a54}
.helpbtn{font:600 11px var(--mono);padding:5px 9px;border-radius:5px;border:1px solid rgba(110,200,255,.35);color:var(--b)}
.help{margin:14px 24px 0;padding:12px 14px;border:1px solid rgba(110,200,255,.25);background:rgba(110,200,255,.05);border-radius:8px;font-size:13px;line-height:1.6;color:#c8d6de}
.help b{color:#fff}.help ul{margin:6px 0 0;padding-left:18px}
#content{flex:1;overflow:auto;padding:18px 24px 40px;display:flex;flex-direction:column;gap:16px}
/* bits */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:14px 16px;border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:8px;text-align:left}
.kpi span{font:600 10px var(--mono);letter-spacing:.14em;color:var(--dim)}.kpi b{display:block;font:700 26px var(--disp);margin:6px 0 2px}.kpi small{font:11.5px var(--mono);color:var(--dim)}
button.kpi:hover{border-color:rgba(255,255,255,.18)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.grid2.even{grid-template-columns:1fr 1fr}
.card{border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:8px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 12px;font:700 13px var(--disp);letter-spacing:.14em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .r{margin-left:auto;font:500 11px var(--mono);color:var(--dim);letter-spacing:0}
.card p.d{margin:0 0 12px;font-size:12.5px;color:var(--dim);line-height:1.55}
.att{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:rgba(0,0,0,.2);width:100%;text-align:left}
.att:hover{border-color:rgba(255,255,255,.18)}
.att i{width:8px;height:8px;border-radius:50%;flex-shrink:0}.att.red i{background:var(--r);box-shadow:0 0 8px var(--r)}.att.gold i{background:var(--g)}.att.blue i{background:var(--b)}
.att .t{flex:1;min-width:0}.att .t b{display:block;font:600 13.5px var(--sans)}.att .t span{font:11.5px var(--mono);color:var(--dim)}
.btn{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--mono);padding:7px 12px;border-radius:5px;border:1px solid rgba(110,255,192,.4);color:var(--m);background:rgba(110,255,192,.06);white-space:nowrap}
.btn:hover{background:rgba(110,255,192,.12)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{border-color:rgba(255,207,110,.45);color:var(--g);background:rgba(255,207,110,.06)}
.btn.red{border-color:rgba(255,107,122,.5);color:var(--r);background:rgba(255,107,122,.06)}
.btn.ghost{border-color:var(--line);color:#b8c4bf;background:transparent}
.btn.solid{background:var(--m);color:#04120b;border-color:var(--m)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 11px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:5px;color:#9fb0a8}
.chip.on{border-color:rgba(110,255,192,.5);color:var(--m);background:rgba(110,255,192,.07)}
.chip.on.red{border-color:rgba(255,107,122,.5);color:var(--r);background:rgba(255,107,122,.07)}
.field{margin-bottom:12px}.field label{display:block;font:600 10px var(--mono);letter-spacing:.14em;color:var(--dim);margin-bottom:6px}
.field .hint{font-size:11.5px;color:#5d6d66;margin-top:5px;line-height:1.45}
.in{width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,.12);border-radius:6px;background:rgba(0,0,0,.35);font-size:14px;outline:none}
.in:focus{border-color:rgba(110,255,192,.55)}
textarea.in{min-height:90px;resize:vertical;font:13.5px/1.5 var(--sans)}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.toggle .sw{width:44px;height:24px;border-radius:12px;background:#1c2622;position:relative;flex-shrink:0;transition:.2s}
.toggle .sw:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#5d6d66;transition:.2s}
.toggle.on .sw{background:rgba(110,255,192,.35)}.toggle.on .sw:after{left:23px;background:var(--m)}
.toggle.red.on .sw{background:rgba(255,107,122,.35)}.toggle.red.on .sw:after{background:var(--r)}
.bar{height:7px;background:#1a2320;border-radius:4px;overflow:hidden}.bar span{display:block;height:100%;background:var(--m)}
.bar span.warn{background:var(--g)}.bar span.bad{background:var(--r)}
.chart{height:150px;display:flex;align-items:flex-end;gap:6px;padding:10px 0 20px}
.chart div{flex:1;background:linear-gradient(180deg,rgba(110,255,192,.55),rgba(110,255,192,.12));border-radius:3px 3px 0 0;position:relative;min-height:2px}
.chart div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font:9.5px var(--mono);color:var(--dim)}
.chart div b{position:absolute;top:-16px;left:0;right:0;text-align:center;font:600 9.5px var(--mono);color:#9fb0a8}
.tbl{width:100%;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font:600 9.5px var(--mono);letter-spacing:.14em;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,.025)}tr.sel td{background:rgba(110,255,192,.06)}
.who b{display:block;font-weight:600}.who small{font:10.5px var(--mono);color:var(--dim)}
.tag{display:inline-block;font:600 9.5px var(--mono);padding:2px 7px;border-radius:3px;letter-spacing:.06em;white-space:nowrap}
.tag.pass{background:rgba(255,207,110,.15);color:var(--g)}.tag.red{background:rgba(255,107,122,.15);color:var(--r)}.tag.ok{background:rgba(110,255,192,.14);color:var(--m)}.tag.blue{background:rgba(110,200,255,.14);color:var(--b)}.tag.dim{background:rgba(255,255,255,.06);color:#9fb0a8}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--dim)}
.empty{padding:28px 12px;text-align:center;font:12.5px var(--mono);color:var(--dim);border:1px dashed rgba(255,255,255,.12);border-radius:8px}
.err{padding:12px 14px;border:1px solid rgba(255,107,122,.4);background:rgba(255,107,122,.06);border-radius:8px;color:#ffb3bc;font-size:13px}
.skel{height:70px;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.02),rgba(255,255,255,.05),rgba(255,255,255,.02));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 10px;font-size:12.5px;margin-bottom:14px}
.kv span{color:var(--dim);font-family:var(--mono);font-size:11.5px}.kv b{font-weight:500;color:#d3dcd8;word-break:break-all}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mini div{padding:9px 10px;border:1px solid var(--line);border-radius:6px}.mini b{display:block;font:700 17px var(--disp)}.mini span{font:9.5px var(--mono);color:var(--dim);letter-spacing:.1em}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;font:11.5px var(--mono);color:var(--dim)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item{padding:12px 14px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:rgba(0,0,0,.15)}
.item.bad{border-color:rgba(255,107,122,.45)}.item.warn{border-color:rgba(255,207,110,.4)}
.item .t{font-weight:600}.item p{margin:6px 0 0;font-size:13px;color:#b8c4bf;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.item small{font:10.5px var(--mono);color:var(--dim)}
.seats{display:flex;gap:3px;margin-top:6px}.seats i{width:14px;height:14px;border-radius:3px;background:rgba(255,255,255,.08)}.seats i.f{background:rgba(110,255,192,.5)}.seats i.x{background:rgba(255,107,122,.6)}
/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal .box{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:#0b100e;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:20px}
#modal h2{margin:0 0 8px;font:700 18px var(--disp)}#modal .body{font-size:13.5px;color:#c3cfc9;line-height:1.55;margin-bottom:14px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{padding:10px 14px;border-radius:7px;font-size:13px;background:#0e1513;border:1px solid rgba(110,255,192,.4);color:#d6f5e6;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:360px;animation:tin .2s}
.toast.bad{border-color:rgba(255,107,122,.5);color:#ffd0d6}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
/* phone */
.mnav{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 30% 0 0;z-index:40;transform:translateX(-105%);transition:.25s;box-shadow:20px 0 40px rgba(0,0,0,.5)}
  .side.open{transform:none}
  .top{padding:10px 14px}.top .sub{display:none}.help{margin:12px 14px 0}
  #content{padding:14px 14px calc(80px + env(safe-area-inset-bottom,0px))}
  .grid2,.grid2.even,.split{grid-template-columns:1fr}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid var(--line);background:#050807;padding-bottom:env(safe-area-inset-bottom,0px)}
  .mnav button{padding:9px 0 11px;font:600 9.5px var(--mono);letter-spacing:.06em;color:#6f8079;position:relative}
  .mnav button.on{color:var(--m)}.mnav button i{display:block;font-style:normal;font-size:16px;margin-bottom:2px}
  .mnav button em{position:absolute;top:4px;right:calc(50% - 22px);font:600 9px var(--mono);font-style:normal;background:var(--r);color:#fff;border-radius:8px;padding:0 5px}
  .menu-btn{display:inline-flex !important}
}
.menu-btn{display:none;font:600 18px var(--mono);padding:2px 8px;border:1px solid var(--line);border-radius:5px}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <h1>SABOTEUR ADMIN</h1>
    <p>Sign in to run the game.</p>
    <div class="field"><label>USERNAME</label><input class="in" id="lu" autocomplete="username"></div>
    <div class="field"><label>PASSWORD</label><input class="in" id="lp" type="password" autocomplete="current-password"></div>
    <div id="lerr" class="err hidden" style="margin-bottom:12px"></div>
    <button class="btn solid" id="lbtn" style="width:100%;justify-content:center;padding:11px">SIGN IN</button>
  </div>
</div>

<div id="app" class="hidden">
  <aside class="side" id="side"></aside>
  <section class="main">
    <div class="top">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div><h1 id="ttl">OVERVIEW</h1><div class="sub" id="sub"></div></div>
      <div class="r">
        <span class="upd" id="upd"></span>
        <button class="helpbtn" id="helpBtn">? HOW THIS WORKS</button>
        <span class="pill" id="netPill">…</span>
      </div>
    </div>
    <div class="help hidden" id="help"></div>
    <div id="content"></div>
  </section>
  <nav class="mnav" id="mnav"></nav>
</div>
<div id="modal" class="hidden"><div class="box" id="mbox"></div></div>
<div id="toasts"></div>

<script>
(() => {
'use strict';
/* ============ basics ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n, d = 0) => (n == null || isNaN(n) ? '—' : Number(n).toLocaleString(undefined, { maximumFractionDigits: d }));
const near = (n) => (n == null ? '—' : `${num(n, 3)}`);
const when = (d) => { if (!d) return '—'; const t = new Date(d); const s = (Date.now() - t) / 1000; if (s < 60) return 'just now'; if (s < 3600) return `${Math.floor(s / 60)}m ago`; if (s < 86400) return `${Math.floor(s / 3600)}h ago`; if (s < 86400 * 7) return `${Math.floor(s / 86400)}d ago`; return t.toLocaleDateString(); };
const full = (d) => (d ? new Date(d).toLocaleString() : '—');
let TOKEN = localStorage.getItem('nsAdminToken') || null;
let ROLE = localStorage.getItem('nsAdminRole') || 'full';
let NET = 'testnet';
const isFull = () => ROLE === 'full';
const explorer = (tx, main) => `https://${main || NET === 'mainnet' ? '' : 'testnet.'}nearblocks.io/txns/${encodeURIComponent(tx)}`;

async function api(path, opts = {}) {
  const o = { ...opts, headers: { ...(opts.headers || {}), ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) } };
  if (o.json !== undefined) { o.method = o.method || 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(o.json); delete o.json; }
  const r = await fetch(path, o);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.startsWith('/admin/login')) { logout(true); throw new Error('Your admin session ended - sign in again.'); }
  if (!r.ok) throw new Error(data.message || `Request failed (${r.status})`);
  return data;
}
async function download(path, name) {
  try {
    const r = await fetch(path, { headers: { Authorization: 'Bearer ' + TOKEN } });
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.message || 'Download failed'); }
    const url = URL.createObjectURL(await r.blob());
    const a = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast(`Downloaded ${name}`);
  } catch (e) { toast(e.message, true); }
}
function toast(msg, bad) {
  const el = Object.assign(document.createElement('div'), { className: 'toast' + (bad ? ' bad' : ''), textContent: msg });
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), bad ? 6000 : 3500);
}
// Promise-based dialog: { title, body, ok, danger, input:{label,placeholder,value,textarea}, choices:[...] }
function ask(o) {
  return new Promise((resolve) => {
    const m = $('#modal'), box = $('#mbox');
    const inp = o.input ? (o.input.textarea ? `<textarea class="in" id="mIn" placeholder="${esc(o.input.placeholder || '')}">${esc(o.input.value || '')}</textarea>` : `<input class="in" id="mIn" placeholder="${esc(o.input.placeholder || '')}" value="${esc(o.input.value || '')}">`) : '';
    box.innerHTML = `<h2>${esc(o.title)}</h2><div class="body">${o.body || ''}</div>
      ${o.input ? `<div class="field"><label>${esc(o.input.label || '')}</label>${inp}${o.input.hint ? `<div class="hint">${esc(o.input.hint)}</div>` : ''}</div>` : ''}
      <div class="acts" style="justify-content:flex-end"><button class="btn ghost" id="mNo">${esc(o.cancel || 'Cancel')}</button>${o.ok === false ? '' : `<button class="btn ${o.danger ? 'red' : 'solid'}" id="mOk">${esc(o.ok || 'OK')}</button>`}</div>`;
    m.classList.remove('hidden');
    const done = (v) => { m.classList.add('hidden'); box.innerHTML = ''; document.removeEventListener('keydown', key); resolve(v); };
    const key = (e) => { if (e.key === 'Escape') done(null); if (e.key === 'Enter' && !(o.input && o.input.textarea) && $('#mOk')) $('#mOk').click(); };
    document.addEventListener('keydown', key);
    $('#mNo').onclick = () => done(null);
    if ($('#mOk')) $('#mOk').onclick = () => done(o.input ? ($('#mIn').value) : true);
    m.onclick = (e) => { if (e.target === m) done(null); };
    setTimeout(() => ($('#mIn') || $('#mOk') || $('#mNo')).focus(), 30);
  });
}
const modalOpen = () => !$('#modal').classList.contains('hidden');
function pager(page, pages, go) {
  if (!pages || pages <= 1) return '';
  const id = 'p' + Math.random().toString(36).slice(2, 8);
  setTimeout(() => { const el = document.getElementById(id); if (!el) return; el.querySelectorAll('button').forEach((b) => b.onclick = () => go(Number(b.dataset.p))); });
  return `<div class="pager" id="${id}"><button class="btn ghost" data-p="${page - 1}" ${page <= 1 ? 'disabled' : ''}>‹ Prev</button><span>Page ${page} of ${pages}</span><button class="btn ghost" data-p="${page + 1}" ${page >= pages ? 'disabled' : ''}>Next ›</button></div>`;
}
// event delegation: any element with data-act="name" calls ACT[name](el)
const ACT = {};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
async function act(btn, fn, okMsg) {
  if (btn) { btn.disabled = true; btn.dataset.label = btn.innerHTML; btn.innerHTML = 'Working…'; }
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message, true); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = btn.dataset.label; } }
}
const guard = (html) => (isFull() ? html : '');

/* ============ pages ============ */
const STATE = { counts: {} };
const PAGES = {

const MOBILE_TABS = ['overview', 'live', 'players', 'playpass', 'reports'];
let current = 'overview', param = null, timer = null, lastLoad = 0;

function renderSide() {
  const c = STATE.counts;
  const badge = { overview: c.attention ? `<em>${c.attention}</em>` : '', live: c.live ? `<em class="ok">${c.live}</em>` : '', playpass: c.refunds ? `<em>${c.refunds}</em>` : '', pools: c.pools ? `<em class="g">${c.pools}</em>` : '', reports: c.reports ? `<em>${c.reports}</em>` : '', avatars: c.avatars ? `<em class="g">${c.avatars}</em>` : '' };
  let g = '', html = `<div class="brand"><i></i><div><b>SABOTEUR</b><small>ADMIN · ${esc(NET.toUpperCase())}</small></div></div>`;
  for (const [k, p] of Object.entries(PAGES)) {
    if (p.grp !== g) { g = p.grp; html += `<div class="grp">${g}</div>`; }
    html += `<button class="nav ${k === current ? 'on' : ''}" data-act="go" data-p="${k}">${esc(p.label)}${badge[k] || ''}</button>`;
  }
  html += `<div class="foot">Signed in · <b>${isFull() ? 'full admin' : 'view only'}</b><br><button class="btn ghost" data-act="logout" style="margin-top:8px">Sign out</button></div>`;
  $('#side').innerHTML = html;
  $('#mnav').innerHTML = MOBILE_TABS.map((k) => `<button class="${k === current ? 'on' : ''}" data-act="go" data-p="${k}"><i>${PAGES[k].icon}</i>${esc(PAGES[k].label.split(' ')[0].toUpperCase())}${badge[k] && /<em/.test(badge[k]) && k !== 'live' ? `<em>${badge[k].replace(/<[^>]+>/g, '')}</em>` : ''}</button>`).join('');
}
ACT.go = (el) => { $('#side').classList.remove('open'); go(el.dataset.p); };
ACT.logout = () => logout();
$('#menuBtn').onclick = (e) => { e.stopPropagation(); $('#side').classList.toggle('open'); };
document.querySelector('.main').addEventListener('click', () => $('#side').classList.remove('open'));
$('#helpBtn').onclick = () => { const h = $('#help'); h.classList.toggle('hidden'); localStorage.setItem('nsAdminHelp_' + current, h.classList.contains('hidden') ? '0' : '1'); };

function go(page, p = null, push = true) {
  if (!PAGES[page]) page = 'overview';
  current = page; param = p;
  if (push) history.replaceState(null, '', `#/${page}${p ? '/' + encodeURIComponent(p) : ''}`);
  const P = PAGES[page];
  $('#ttl').textContent = P.title; $('#sub').textContent = P.sub;
  $('#help').innerHTML = P.help;
  const seen = localStorage.getItem('nsAdminHelp_' + page);
  $('#help').classList.toggle('hidden', seen === '0' || (seen === null && page !== 'overview'));
  renderSide();
  $('#content').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  $('#content').scrollTop = 0;
  load(true);
}
async function load(first) {
  clearTimeout(timer);
  const page = current;
  // never refresh under the admin's hands: typing, a dialog open, or tab hidden
  const busy = !first && (modalOpen() || document.visibilityState !== 'visible' || (document.activeElement && $('#content').contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)));
  if (!busy) {
    try {
      const scroll = $('#content').scrollTop;
      await R[page]($('#content'), first);
      if (!first) $('#content').scrollTop = scroll;
      lastLoad = Date.now();
    } catch (e) { if (first) $('#content').innerHTML = `<div class="err">Couldn't load this page: ${esc(e.message)}</div>`; }
  }
  const s = PAGES[page].refresh;
  if (s && page === current) timer = setTimeout(() => load(false), s * 1000);
}
setInterval(() => { $('#upd').textContent = lastLoad ? `updated ${when(lastLoad).replace('just now', 'now')}` : ''; }, 5000);
async function refreshCounts() {
  try {
    const d = await api('/admin/overview');
    STATE.overview = d;
    STATE.counts = { attention: (d.refundsOwed || 0) + (d.needsAttentionCount || 0) + (d.openReports || 0) + (d.customAvatarPending || 0), live: d.activeRooms, refunds: d.refundsOwed, pools: d.needsAttentionCount, reports: d.openReports, avatars: d.customAvatarPending };
    NET = d.network || NET;
    $('#netPill').textContent = NET.toUpperCase(); $('#netPill').className = 'pill ' + (NET === 'mainnet' ? 'main' : 'live');
    renderSide();
  } catch (e) { /* shown by the page itself */ }
}

ACT.dl = (b) => download(b.dataset.u, b.dataset.n.replace('.', `-${new Date().toISOString().slice(0, 10)}.`));
ACT.pause = async () => {
  const s = await api('/admin/settings'); const next = !s.poolsPaused;
  const ok = await ask({ title: next ? 'Pause new pool & paid games?' : 'Resume pool & paid games?', body: next ? 'Players won\'t be able to start NEW pool or paid games until you resume. Free Play and matches already running are not affected.' : 'Players can start pool and paid games again.', ok: next ? 'Pause' : 'Resume', danger: next });
  if (!ok) return;
  await act(null, () => api('/admin/settings/pools-paused', { json: { value: next } }), next ? 'Paused' : 'Resumed'); load(false);
};

/* match history */
let rmQ = { page: 1, search: '' };
R.rooms = async (el, first) => {
  if (param) {

    return;
  }

  const rows = `<div class="card" style="padding:8px 10px">${d.rooms.length ? `<div class="tbl"><table><tr><th>ROOM</th><th>TYPE</th><th>PLAYERS</th><th>MATCHES</th><th>LAST PLAYED</th></tr>${d.rooms.map((r) => `<tr class="click" data-act="rm" data-id="${esc(r.roomSessionId)}"><td class="mono" style="color:var(--m);font-weight:700">${esc(r.roomCode || '—')}</td><td>${r.isPoolGame ? `<span class="tag pass">${esc(r.poolName || r.gameMode || 'POOL')}</span>` : `<span class="tag dim">${esc(r.gameMode || 'free')}</span>`}</td><td>${num(r.playerCount)}</td><td>${num(r.matchCount)}</td><td class="mono">${when(r.latestAt)}</td></tr>`).join('')}</table></div>` : '<div class="empty">No rooms yet.</div>'}${pager(d.page, d.pages, (n) => { rmQ.page = n; load(false); })}</div>`;
  if (first || !$('#rmSearch')) {
    el.innerHTML = `<div class="row"><input class="in" id="rmSearch" placeholder="Search room code…" value="${esc(rmQ.search)}" style="max-width:300px"><span class="muted mono">${num(d.total)} room sessions</span></div><div id="rmList">${rows}</div>`;
    let t; $('#rmSearch').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { rmQ.search = e.target.value.trim(); rmQ.page = 1; load(false); }, 300); };
  } else $('#rmList').innerHTML = rows;
};
ACT.rm = (r) => go('rooms', r.dataset.id);

/* play pass */

      ${pur.rows.length ? `<div class="tbl"><table><tr><th>WHEN</th><th>PLAYER</th><th>PAID FROM</th><th>NEAR</th><th>STATUS</th><th></th></tr>${pur.rows.map((r) => `<tr><td class="mono">${when(r.createdAt)}</td><td>${esc(r.playerName || '—')}</td><td class="mono">${esc(r.payerAccountId)}</td><td>${r.amountNear}</td><td>${r.status === 'needs_refund' ? `<span class="tag red">REFUND OWED</span><br><small class="muted">${esc(r.reason || '')}</small>` : r.status === 'granted' ? '<span class="tag ok">SOLD</span>' : '<span class="tag blue">REFUNDED</span>'}</td><td style="text-align:right;white-space:nowrap"><a class="mono" href="${explorer(r.txHash, true)}" target="_blank" rel="noreferrer">tx ↗</a>${r.refundTxHash ? ` · <a class="mono" href="${explorer(r.refundTxHash, true)}" target="_blank" rel="noreferrer">refund ↗</a>` : ''}${r.status === 'needs_refund' ? guard(` <button class="btn red" data-act="refunded" data-id="${r._id}" data-a="${r.amountNear}" data-to="${esc(r.payerAccountId)}">Mark refunded</button>`) : ''}</td></tr>`).join('')}</table></div>` : `<div class="empty">${ppQ.status === 'needs_refund' ? 'No refunds owed.' : 'Nothing here yet.'}</div>`}</div>`;
  const settings = `<div class="card"><h3>PRICE & SALES</h3>
      <div class="field"><label>PRICE · REAL NEAR (MAINNET)</label><input class="in" id="ppPrice" type="number" min="0.01" step="0.01" value="${cfg.priceNear}" ${isFull() ? '' : 'disabled'}></div>
      <div class="field"><label>DISCOUNT %</label><input class="in" id="ppDisc" type="number" min="0" max="100" step="1" value="${cfg.discountPercent || 0}" ${isFull() ? '' : 'disabled'}><div class="hint">Players pay <b id="ppEff">${cfg.effectivePriceNear}</b> NEAR now. Raising the discount posts a News announcement.</div></div>
      <div class="field"><label>GAMES BETWEEN SKIN UNLOCKS</label><input class="in" id="ppGap" type="number" min="1" step="1" value="${cfg.unlockGamesGap || 2}" ${isFull() ? '' : 'disabled'}><div class="hint">The first skin unlocks right away; each next one after this many games.</div></div>
      <div class="toggle ${cfg.enabled ? 'on' : ''}" id="ppEn" ${isFull() ? 'data-act="ppEn"' : ''} style="margin:4px 0 14px"><div class="sw"></div><b style="font-weight:600">${cfg.enabled ? 'Sales are ON' : 'Sales are OFF'}</b></div>
      ${guard('<button class="btn solid" data-act="ppSave">Save settings</button>')}</div>`;
  const holders = `<div class="card"><h3>HOLDERS <span class="r">${num(hold.total)}</span></h3><div class="row" style="margin-bottom:10px"><input class="in" id="ppHS" placeholder="Search holders…" value="${esc(ppQ.hsearch)}" style="max-width:300px">${guard('<button class="btn gold" data-act="ppGiftFind">Gift to a player…</button>')}</div>
      ${hold.holders.length ? `<div class="tbl"><table><tr><th>PLAYER</th><th>HOW</th><th>UNTIL</th><th></th></tr>${hold.holders.map((h) => `<tr><td class="who"><b>${esc(h.name || '—')}</b><small>${h.username ? '@' + esc(h.username) : esc(h.email || '')}</small></td><td><span class="tag ${h.source === 'purchased' ? 'pass' : 'blue'}">${esc((h.source || '').toUpperCase())}</span></td><td class="mono">${h.isPermanent ? 'forever' : full(h.premiumUntil)}</td><td style="text-align:right">${guard(`<button class="btn red" data-act="revoke2" data-id="${h.id}">Remove</button>`)}</td></tr>`).join('')}</table></div>` : '<div class="empty">No holders match.</div>'}${pager(hold.page, hold.totalPages, (n) => { ppQ.hpage = n; load(false); })}</div>`;

  const upd = () => { const p = Number($('#ppPrice')?.value) || 0, d = Number($('#ppDisc')?.value) || 0; if ($('#ppEff')) $('#ppEff').textContent = +(p * (1 - d / 100)).toFixed(4); };
  ['#ppPrice', '#ppDisc'].forEach((s) => { const x = $(s); if (x) x.oninput = upd; });
};
ACT.ppS = (b) => { ppQ.status = b.dataset.k; load(false); };
ACT.ppEn = (t) => { t.classList.toggle('on'); t.querySelector('b').textContent = t.classList.contains('on') ? 'Sales are ON' : 'Sales are OFF'; };

ACT.ppGiftFind = async () => {
  const q = await ask({ title: 'Gift Play Pass to…', input: { label: 'PLAYER NAME, @USERNAME OR EMAIL', placeholder: 'Search' }, ok: 'Find' });

  const d = await api(`/admin/players?search=${encodeURIComponent(q.trim())}`).catch((e) => { toast(e.message, true); return null; });

  if (!await ask({ title: `Resolve pool #${b.dataset.p}?`, body: 'The server retries the right on-chain action: pay out the winners if at least one match finished, otherwise refund everyone.', ok: 'Resolve now' })) return;
  const r = await act(b, () => api(`/admin/funds/${b.dataset.p}/retry`, { method: 'POST' }));
  if (r && r.result) toast(r.result.skipped ? `Not resolved: ${r.result.reason}` : `Done: ${r.result.action}${r.result.outcome && r.result.outcome.success ? ' ✓' : ' — check the pool'}`, !!r.result.skipped);

};

  const d = await api('/admin/action-log?page=' + lgPage);
  STATE.logs = d.logs;
  el.innerHTML = `<div class="card" style="padding:8px 10px">${d.logs.length ? `<div class="tbl"><table><tr><th>WHEN</th><th>ACTION</th><th>DETAILS</th></tr>${d.logs.map((l, i) => `<tr class="click" data-act="lgD" data-i="${i}"><td class="mono">${when(l.createdAt)}</td><td><span class="tag ${/fail|hold|refund|revoke|delete/.test(l.action) ? 'red' : /grant|purchas|gift/.test(l.action) ? 'pass' : 'dim'}">${esc(l.action)}</span></td><td class="muted" style="font-size:12px">${esc(Object.entries(l.details || {}).slice(0, 3).map(([k, v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' · ')).slice(0, 140)}</td></tr>`).join('')}</table></div>` : '<div class="empty">Nothing logged yet.</div>'}${pager(d.page, d.pages, (n) => { lgPage = n; load(false); })}</div>`;
};
ACT.lgD = (r) => { const l = STATE.logs[r.dataset.i]; if (!l) return; ask({ title: l.action, body: `<div class="muted mono" style="margin-bottom:10px">${full(l.createdAt)}</div><div class="kv">${Object.entries(l.details || {}).map(([k, v]) => `<span>${esc(k)}</span><b>${esc(typeof v === 'object' ? JSON.stringify(v) : String(v))}</b>`).join('') || '<span>—</span><b>No details</b>'}</div>`, ok: false, cancel: 'Close' }); };

/* system */
R.system = async (el) => {
  const db = await api('/admin/db-stats').catch(() => null);
  el.innerHTML = `<div class="grid2 even"><div class="card"><h3>BACKUPS</h3><p class="d">The free MongoDB has no automatic backups. Download a full copy regularly and keep it somewhere safe (not in the repo).</p><div class="acts"><button class="btn solid" data-act="dl" data-u="/admin/backup/export" data-n="backup.json">⬇ Full backup (JSON)</button><button class="btn" data-act="dl" data-u="/admin/export/csv?type=players" data-n="players.csv">Players CSV</button><button class="btn" data-act="dl" data-u="/admin/export/csv?type=matches" data-n="matches.csv">Matches CSV</button><button class="btn" data-act="dl" data-u="/admin/export/csv?type=funds" data-n="money.csv">Money CSV</button></div></div>
    <div class="card"><h3>DATABASE USAGE</h3>${db ? `<div class="kv"><span>Storage</span><b>${db.storageUsedMb} / ${db.storageLimitMb} MB (${db.percentUsed}%)</b><span>Data</span><b>${db.dataUsedMb} MB</b><span>Indexes</span><b>${db.indexUsedMb} MB</b><span>Collections</span><b>${db.collections}</b><span>Server up</span><b>${Math.round(db.serverUptimeSeconds / 60)} min</b></div><div class="bar"><span class="${db.percentUsed > 85 ? 'bad' : db.percentUsed > 60 ? 'warn' : ''}" style="width:${Math.min(100, db.percentUsed)}%"></span></div>` : '<div class="muted">Unavailable</div>'}</div></div>`;
};

/* ============ boot ============ */
function logout(silent) {
  if (!silent && TOKEN) fetch('/admin/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN } }).catch(() => {});
  TOKEN = null; localStorage.removeItem('nsAdminToken'); localStorage.removeItem('nsAdminRole');
  clearTimeout(timer); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
}
async function start() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  const [, pg, pr] = (location.hash || '').split('/');
  await refreshCounts();
  go(PAGES[pg] ? pg : 'overview', pr ? decodeURIComponent(pr) : null, false);
}
$('#lbtn').onclick = async () => {
  const b = $('#lbtn'), e = $('#lerr'); e.classList.add('hidden');
  b.disabled = true; b.textContent = 'SIGNING IN…';
  try {
    const d = await api('/admin/login', { json: { username: $('#lu').value.trim(), password: $('#lp').value } });
    TOKEN = d.token; ROLE = d.role || 'full'; localStorage.setItem('nsAdminToken', TOKEN); localStorage.setItem('nsAdminRole', ROLE); $('#lp').value = '';
    start();
  } catch (err) { e.textContent = err.message; e.classList.remove('hidden'); }
  b.disabled = false; b.textContent = 'SIGN IN';
};
['#lu', '#lp'].forEach((s) => $(s).addEventListener('keydown', (ev) => { if (ev.key === 'Enter') $('#lbtn').click(); }));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && TOKEN && Date.now() - lastLoad > 15000) load(false); });
window.addEventListener('hashchange', () => { const [, pg, pr] = location.hash.split('/'); const p = pr ? decodeURIComponent(pr) : null; if (PAGES[pg] && (pg !== current || p !== param)) go(pg, p, false); });
if (TOKEN) start(); else $('#lu').focus();
})();
</script>
</body>
</html>
