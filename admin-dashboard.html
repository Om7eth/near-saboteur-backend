<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NEAR Saboteur · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--m:#6effc0;--g:#ffcf6e;--r:#ff6b7a;--b:#6ec8ff;--ink:#e6ece9;--dim:#7d8d86;--line:rgba(255,255,255,.08);--bg:#070a09;--mono:'IBM Plex Mono',monospace;--disp:'Space Grotesk',sans-serif;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--m)}
.hidden{display:none !important}
/* login */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:380px;border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:10px;padding:26px 24px}
.lbox h1{margin:0 0 4px;font:700 22px var(--disp);letter-spacing:.12em}
.lbox p{margin:0 0 18px;color:var(--dim);font-size:13px}
/* shell */
#app{height:100%;display:grid;grid-template-columns:236px 1fr}
.side{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;background:#050807;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;margin:0 6px 14px}
.brand i{width:30px;height:30px;background:radial-gradient(circle at 35% 30%,#9dffd6,#1d6b4f);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);flex-shrink:0}
.brand b{font:700 15px var(--disp);letter-spacing:.14em}.brand small{display:block;font:10px var(--mono);color:var(--dim);letter-spacing:.14em}
.grp{font:600 9.5px var(--mono);letter-spacing:.18em;color:#4b5a54;margin:14px 10px 5px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font:500 13.5px var(--sans);color:#9fb0a8;text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.03);color:#d6e0db}
.nav.on{background:rgba(110,255,192,.1);color:#fff;box-shadow:inset 2px 0 0 var(--m)}
.nav em{margin-left:auto;font:600 10px var(--mono);font-style:normal;padding:1px 7px;border-radius:9px;background:rgba(255,107,122,.18);color:var(--r)}
.nav em.g{background:rgba(255,207,110,.15);color:var(--g)}.nav em.ok{background:rgba(110,255,192,.14);color:var(--m)}
.foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);font:11px var(--mono);color:var(--dim);line-height:1.7}
.foot b{color:var(--m);font-weight:600}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{min-height:62px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{margin:0;font:700 19px var(--disp);letter-spacing:.08em}
.top .sub{font:11.5px var(--mono);color:var(--dim)}
.top .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{font:600 11px var(--mono);padding:5px 9px;border-radius:5px;border:1px solid var(--line);color:#b8c4bf;white-space:nowrap}
.pill.live{border-color:rgba(110,255,192,.4);color:var(--m)}.pill.main{border-color:rgba(255,207,110,.5);color:var(--g)}
.upd{font:10.5px var(--mono);color:#4b5a54}
.helpbtn{font:600 11px var(--mono);padding:5px 9px;border-radius:5px;border:1px solid rgba(110,200,255,.35);color:var(--b)}
.help{margin:14px 24px 0;padding:12px 14px;border:1px solid rgba(110,200,255,.25);background:rgba(110,200,255,.05);border-radius:8px;font-size:13px;line-height:1.6;color:#c8d6de}
.help b{color:#fff}.help ul{margin:6px 0 0;padding-left:18px}
#content{flex:1;overflow:auto;padding:18px 24px 40px;display:flex;flex-direction:column;gap:16px}
/* bits */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:14px 16px;border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:8px;text-align:left}
.kpi span{font:600 10px var(--mono);letter-spacing:.14em;color:var(--dim)}.kpi b{display:block;font:700 26px var(--disp);margin:6px 0 2px}.kpi small{font:11.5px var(--mono);color:var(--dim)}
button.kpi:hover{border-color:rgba(255,255,255,.18)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.grid2.even{grid-template-columns:1fr 1fr}
.card{border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:8px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 12px;font:700 13px var(--disp);letter-spacing:.14em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .r{margin-left:auto;font:500 11px var(--mono);color:var(--dim);letter-spacing:0}
.card p.d{margin:0 0 12px;font-size:12.5px;color:var(--dim);line-height:1.55}
.att{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:rgba(0,0,0,.2);width:100%;text-align:left}
.att:hover{border-color:rgba(255,255,255,.18)}
.att i{width:8px;height:8px;border-radius:50%;flex-shrink:0}.att.red i{background:var(--r);box-shadow:0 0 8px var(--r)}.att.gold i{background:var(--g)}.att.blue i{background:var(--b)}
.att .t{flex:1;min-width:0}.att .t b{display:block;font:600 13.5px var(--sans)}.att .t span{font:11.5px var(--mono);color:var(--dim)}
.btn{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--mono);padding:7px 12px;border-radius:5px;border:1px solid rgba(110,255,192,.4);color:var(--m);background:rgba(110,255,192,.06);white-space:nowrap}
.btn:hover{background:rgba(110,255,192,.12)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{border-color:rgba(255,207,110,.45);color:var(--g);background:rgba(255,207,110,.06)}
.btn.red{border-color:rgba(255,107,122,.5);color:var(--r);background:rgba(255,107,122,.06)}
.btn.ghost{border-color:var(--line);color:#b8c4bf;background:transparent}
.btn.solid{background:var(--m);color:#04120b;border-color:var(--m)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 11px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:5px;color:#9fb0a8}
.chip.on{border-color:rgba(110,255,192,.5);color:var(--m);background:rgba(110,255,192,.07)}
.chip.on.red{border-color:rgba(255,107,122,.5);color:var(--r);background:rgba(255,107,122,.07)}
.field{margin-bottom:12px}.field label{display:block;font:600 10px var(--mono);letter-spacing:.14em;color:var(--dim);margin-bottom:6px}
.field .hint{font-size:11.5px;color:#5d6d66;margin-top:5px;line-height:1.45}
.in{width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,.12);border-radius:6px;background:rgba(0,0,0,.35);font-size:14px;outline:none}
.in:focus{border-color:rgba(110,255,192,.55)}
textarea.in{min-height:90px;resize:vertical;font:13.5px/1.5 var(--sans)}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.toggle .sw{width:44px;height:24px;border-radius:12px;background:#1c2622;position:relative;flex-shrink:0;transition:.2s}
.toggle .sw:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#5d6d66;transition:.2s}
.toggle.on .sw{background:rgba(110,255,192,.35)}.toggle.on .sw:after{left:23px;background:var(--m)}
.toggle.red.on .sw{background:rgba(255,107,122,.35)}.toggle.red.on .sw:after{background:var(--r)}
.bar{height:7px;background:#1a2320;border-radius:4px;overflow:hidden}.bar span{display:block;height:100%;background:var(--m)}
.bar span.warn{background:var(--g)}.bar span.bad{background:var(--r)}
.chart{height:150px;display:flex;align-items:flex-end;gap:6px;padding:10px 0 20px}
.chart div{flex:1;background:linear-gradient(180deg,rgba(110,255,192,.55),rgba(110,255,192,.12));border-radius:3px 3px 0 0;position:relative;min-height:2px}
.chart div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font:9.5px var(--mono);color:var(--dim)}
.chart div b{position:absolute;top:-16px;left:0;right:0;text-align:center;font:600 9.5px var(--mono);color:#9fb0a8}
.tbl{width:100%;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font:600 9.5px var(--mono);letter-spacing:.14em;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,.025)}tr.sel td{background:rgba(110,255,192,.06)}
.who b{display:block;font-weight:600}.who small{font:10.5px var(--mono);color:var(--dim)}
.tag{display:inline-block;font:600 9.5px var(--mono);padding:2px 7px;border-radius:3px;letter-spacing:.06em;white-space:nowrap}
.tag.pass{background:rgba(255,207,110,.15);color:var(--g)}.tag.red{background:rgba(255,107,122,.15);color:var(--r)}.tag.ok{background:rgba(110,255,192,.14);color:var(--m)}.tag.blue{background:rgba(110,200,255,.14);color:var(--b)}.tag.dim{background:rgba(255,255,255,.06);color:#9fb0a8}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--dim)}
.empty{padding:28px 12px;text-align:center;font:12.5px var(--mono);color:var(--dim);border:1px dashed rgba(255,255,255,.12);border-radius:8px}
.err{padding:12px 14px;border:1px solid rgba(255,107,122,.4);background:rgba(255,107,122,.06);border-radius:8px;color:#ffb3bc;font-size:13px}
.skel{height:70px;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.02),rgba(255,255,255,.05),rgba(255,255,255,.02));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 10px;font-size:12.5px;margin-bottom:14px}
.kv span{color:var(--dim);font-family:var(--mono);font-size:11.5px}.kv b{font-weight:500;color:#d3dcd8;word-break:break-all}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mini div{padding:9px 10px;border:1px solid var(--line);border-radius:6px}.mini b{display:block;font:700 17px var(--disp)}.mini span{font:9.5px var(--mono);color:var(--dim);letter-spacing:.1em}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;font:11.5px var(--mono);color:var(--dim)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item{padding:12px 14px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:rgba(0,0,0,.15)}
.item.bad{border-color:rgba(255,107,122,.45)}.item.warn{border-color:rgba(255,207,110,.4)}
.item .t{font-weight:600}.item p{margin:6px 0 0;font-size:13px;color:#b8c4bf;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.item small{font:10.5px var(--mono);color:var(--dim)}
.seats{display:flex;gap:3px;margin-top:6px}.seats i{width:14px;height:14px;border-radius:3px;background:rgba(255,255,255,.08)}.seats i.f{background:rgba(110,255,192,.5)}.seats i.x{background:rgba(255,107,122,.6)}
/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal .box{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:#0b100e;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:20px}
#modal h2{margin:0 0 8px;font:700 18px var(--disp)}#modal .body{font-size:13.5px;color:#c3cfc9;line-height:1.55;margin-bottom:14px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{padding:10px 14px;border-radius:7px;font-size:13px;background:#0e1513;border:1px solid rgba(110,255,192,.4);color:#d6f5e6;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:360px;animation:tin .2s}
.toast.bad{border-color:rgba(255,107,122,.5);color:#ffd0d6}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
/* phone */
.mnav{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 30% 0 0;z-index:40;transform:translateX(-105%);transition:.25s;box-shadow:20px 0 40px rgba(0,0,0,.5)}
  .side.open{transform:none}
  .top{padding:10px 14px}.top .sub{display:none}.help{margin:12px 14px 0}
  #content{padding:14px 14px calc(80px + env(safe-area-inset-bottom,0px))}
  .grid2,.grid2.even,.split{grid-template-columns:1fr}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid var(--line);background:#050807;padding-bottom:env(safe-area-inset-bottom,0px)}
  .mnav button{padding:9px 0 11px;font:600 9.5px var(--mono);letter-spacing:.06em;color:#6f8079;position:relative}
  .mnav button.on{color:var(--m)}.mnav button i{display:block;font-style:normal;font-size:16px;margin-bottom:2px}
  .mnav button em{position:absolute;top:4px;right:calc(50% - 22px);font:600 9px var(--mono);font-style:normal;background:var(--r);color:#fff;border-radius:8px;padding:0 5px}
  .menu-btn{display:inline-flex !important}
}
/* weekly rewards */
.wa-ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.wa-ph .r{margin-left:auto}
.wa-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.wa-c4{grid-column:span 4}.wa-c5{grid-column:span 5}.wa-c7{grid-column:span 7}.wa-c12{grid-column:span 12}
.wa-big{font:700 24px var(--disp)}.wa-big small{font:500 12px var(--mono);color:var(--dim)}
.wa-note{font-size:12.5px;color:var(--dim);line-height:1.55;margin-top:8px}.wa-note b{color:#fff}
.wa-in{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:6px 8px 6px 12px;font-weight:700}
.wa-in input{background:none;border:none;color:#fff;font:700 18px var(--disp);width:80px;outline:none}.wa-in span{color:var(--dim);font:500 11px var(--mono);flex:1;white-space:nowrap}
.wa-warn{border-left:3px solid var(--g);background:rgba(255,207,110,.07);padding:10px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:#e8dfc0;line-height:1.5}
.wa-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wa-step{border:1px dashed rgba(110,255,192,.3);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#c2ccc8;line-height:1.5}.wa-step b{display:block;color:#fff;margin-bottom:3px}
.wa-step.done{border-style:solid;border-color:rgba(110,255,192,.45);background:rgba(110,255,192,.05)}.wa-step.done b{color:var(--m)}
.wa-gold{border-color:rgba(255,207,110,.45);background:linear-gradient(135deg,rgba(255,207,110,.08),rgba(255,255,255,.02))}
.wa-lbl{font:600 11px var(--mono);color:var(--dim);letter-spacing:.1em}.wa-cd{font:700 40px var(--mono);color:var(--g)}
.wa-rk{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:3px 0;font-size:13px}.wa-rk .p{font:700 12px var(--mono);color:var(--g)}.wa-no{color:#ffb84d}
@media (max-width:900px){.wa-c4,.wa-c5,.wa-c7{grid-column:span 12}.wa-steps{grid-template-columns:1fr}}
.menu-btn{display:none;font:600 18px var(--mono);padding:2px 8px;border:1px solid var(--line);border-radius:5px}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <h1>SABOTEUR ADMIN</h1>
    <p>Sign in to run the game.</p>
    <div class="field"><label>USERNAME</label><input class="in" id="lu" autocomplete="username"></div>
    <div class="field"><label>PASSWORD</label><input class="in" id="lp" type="password" autocomplete="current-password"></div>
    <div id="lerr" class="err hidden" style="margin-bottom:12px"></div>
    <button class="btn solid" id="lbtn" style="width:100%;justify-content:center;padding:11px">SIGN IN</button>
  </div>
</div>

<div id="app" class="hidden">
  <aside class="side" id="side"></aside>
  <section class="main">
    <div class="top">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div><h1 id="ttl">OVERVIEW</h1><div class="sub" id="sub"></div></div>
      <div class="r">
        <span class="upd" id="upd"></span>
        <button class="helpbtn" id="helpBtn">? HOW THIS WORKS</button>
        <span class="pill" id="netPill">…</span>
      </div>
    </div>
    <div class="help hidden" id="help"></div>
    <div id="content"></div>
  </section>
  <nav class="mnav" id="mnav"></nav>
</div>
<div id="modal" class="hidden"><div class="box" id="mbox"></div></div>
<div id="toasts"></div>

<script>
(() => {
'use strict';
/* ============ basics ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n, d = 0) => (n == null || isNaN(n) ? '—' : Number(n).toLocaleString(undefined, { maximumFractionDigits: d }));
const near = (n) => (n == null ? '—' : `${num(n, 3)}`);
const when = (d) => { if (!d) return '—'; const t = new Date(d); const s = (Date.now() - t) / 1000; if (s < 60) return 'just now'; if (s < 3600) return `${Math.floor(s / 60)}m ago`; if (s < 86400) return `${Math.floor(s / 3600)}h ago`; if (s < 86400 * 7) return `${Math.floor(s / 86400)}d ago`; return t.toLocaleDateString(); };
const full = (d) => (d ? new Date(d).toLocaleString() : '—');
let TOKEN = localStorage.getItem('nsAdminToken') || null;
let ROLE = localStorage.getItem('nsAdminRole') || 'full';
let NET = 'testnet';
const isFull = () => ROLE === 'full';
const explorer = (tx, main) => `https://${main || NET === 'mainnet' ? '' : 'testnet.'}nearblocks.io/txns/${encodeURIComponent(tx)}`;

async function api(path, opts = {}) {
  const o = { ...opts, headers: { ...(opts.headers || {}), ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) } };
  if (o.json !== undefined) { o.method = o.method || 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(o.json); delete o.json; }
  const r = await fetch(path, o);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.startsWith('/admin/login')) { logout(true); throw new Error('Your admin session ended - sign in again.'); }
  if (!r.ok) throw new Error(data.message || `Request failed (${r.status})`);
  return data;
}
async function download(path, name) {
  try {
    const r = await fetch(path, { headers: { Authorization: 'Bearer ' + TOKEN } });
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.message || 'Download failed'); }
    const url = URL.createObjectURL(await r.blob());
    const a = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast(`Downloaded ${name}`);
  } catch (e) { toast(e.message, true); }
}
function toast(msg, bad) {
  const el = Object.assign(document.createElement('div'), { className: 'toast' + (bad ? ' bad' : ''), textContent: msg });
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), bad ? 6000 : 3500);
}
// Promise-based dialog: { title, body, ok, danger, input:{label,placeholder,value,textarea}, choices:[...] }
function ask(o) {
  return new Promise((resolve) => {
    const m = $('#modal'), box = $('#mbox');
    const inp = o.input ? (o.input.textarea ? `<textarea class="in" id="mIn" placeholder="${esc(o.input.placeholder || '')}">${esc(o.input.value || '')}</textarea>` : `<input class="in" id="mIn" placeholder="${esc(o.input.placeholder || '')}" value="${esc(o.input.value || '')}">`) : '';
    box.innerHTML = `<h2>${esc(o.title)}</h2><div class="body">${o.body || ''}</div>
      ${o.input ? `<div class="field"><label>${esc(o.input.label || '')}</label>${inp}${o.input.hint ? `<div class="hint">${esc(o.input.hint)}</div>` : ''}</div>` : ''}
      <div class="acts" style="justify-content:flex-end"><button class="btn ghost" id="mNo">${esc(o.cancel || 'Cancel')}</button>${o.ok === false ? '' : `<button class="btn ${o.danger ? 'red' : 'solid'}" id="mOk">${esc(o.ok || 'OK')}</button>`}</div>`;
    m.classList.remove('hidden');
    const done = (v) => { m.classList.add('hidden'); box.innerHTML = ''; document.removeEventListener('keydown', key); resolve(v); };
    const key = (e) => { if (e.key === 'Escape') done(null); if (e.key === 'Enter' && !(o.input && o.input.textarea) && $('#mOk')) $('#mOk').click(); };

    $('#mNo').onclick = () => done(null);
    if ($('#mOk')) $('#mOk').onclick = () => done(o.input ? ($('#mIn').value) : true);
    m.onclick = (e) => { if (e.target === m) done(null); };
    setTimeout(() => ($('#mIn') || $('#mOk') || $('#mNo')).focus(), 30);
  });
}

ACT.chRes = async (b) => {

  const r = await act(b, () => api(`/admin/pools/chain-orphans/${b.dataset.p}/resolve`, { method: 'POST' }));
  poQ.chainData = null; // rescan to show the new state
  if (r && r.result) toast(r.result.skipped ? `Not resolved: ${r.result.reason}` : `Done: ${r.result.action}${r.result.outcome && r.result.outcome.success ? ' ✓' : ' — failed: ' + ((r.result.outcome && r.result.outcome.error) || '')}`, !(r.result.outcome && r.result.outcome.success));

};

ACT.poRetry = async (b) => {

  const r = await act(b, () => api(`/admin/funds/${b.dataset.p}/retry`, { method: 'POST' }));
  if (r && r.result) toast(r.result.skipped ? `Not resolved: ${r.result.reason}` : `Done: ${r.result.action}${r.result.outcome && r.result.outcome.success ? ' ✓' : ' — check the pool'}`, !!r.result.skipped);
  load(false);
};
ACT.poRefund = async (b) => { if (!await ask({ title: 'Refund this one player?', body: `Sends <b>${esc(b.dataset.a)}</b> their entry fee back from pool #${esc(b.dataset.p)}. Everyone else stays in.`, ok: 'Refund', danger: true })) return; await act(b, () => api(`/admin/funds/${b.dataset.p}/refund-participant`, { json: { accountId: b.dataset.a } }), 'Refunded'); load(false); };
ACT.poResolve = async (b) => { const v = await ask({ title: 'Mark resolved (no refund)?', input: { label: 'NOTE (OPTIONAL)', placeholder: 'Why no refund is needed' }, ok: 'Mark resolved' }); if (v === null) return; await act(b, () => api(`/admin/funds/${b.dataset.p}/resolve-stuck-report`, { json: { accountId: b.dataset.a, note: v } }), 'Resolved'); load(false); };

/* wallets */
/* ============ weekly rewards (NEAR Intents agent) ============ */
// saboteur.near signs owner actions right here with its own wallet (HOT /
// Meteor / Intear / Ledger via NEAR Connect, served from this server). The
// server only prepares and submits them; it never sees the wallet's key.
const WA = { conn: null, wallet: null, account: null, d: null };
const mmss = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
setInterval(() => document.querySelectorAll('[data-cd]').forEach((e) => { e.textContent = mmss(new Date(e.dataset.cd) - Date.now()); }), 1000);
const shortId = (s) => (s && s.length > 14 ? `${s.slice(0, 8)}…${s.slice(-4)}` : s || '—');
const inTime = (d) => { const ms = new Date(d) - Date.now(); if (ms <= 0) return 'now'; const h = Math.floor(ms / 3600e3), dd = Math.floor(h / 24); return dd ? `in ${dd}d ${h % 24}h` : `in ${h}h ${Math.floor((ms % 3600e3) / 60e3)}m`; };
async function waConnector() {
  if (WA.conn) return WA.conn;
  const { NearConnector } = await import('/vendor/near-connect-0.12.0.js');
  WA.conn = new NearConnector({ network: 'mainnet', features: { signDelegateActions: true }, footerBranding: null });
  WA.conn.on('wallet:signOut', () => { WA.wallet = null; WA.account = null; load(false); });
  await WA.conn.whenManifestLoaded;
  try { WA.wallet = await WA.conn.wallet(); const a = await WA.wallet.getAccounts(); WA.account = a && a[0] ? a[0] : null; } catch { WA.wallet = null; }
  return WA.conn;
}
ACT.waConnect = async (b) => {
  await act(b, async () => {
    const c = await waConnector();
    if (WA.wallet && WA.account && WA.account.accountId !== WA.d.owner) { await c.disconnect().catch(() => {}); WA.wallet = null; WA.account = null; }
    if (!WA.wallet) { await c.connect(); WA.wallet = await c.wallet(); const a = await WA.wallet.getAccounts(); WA.account = a && a[0] ? a[0] : null; }
    if (!WA.account || WA.account.accountId !== WA.d.owner) throw new Error(`Connected ${WA.account ? WA.account.accountId : 'nothing'}. Connect ${WA.d.owner} instead.`);
  }, `${WA.d.owner} connected`);
  load(false);
};
ACT.waDisconnect = async (b) => { await act(b, async () => { const c = await waConnector(); await c.disconnect(); WA.wallet = null; WA.account = null; }); load(false); };
const waConnected = () => !!(WA.wallet && WA.account && WA.d && WA.account.accountId === WA.d.owner);
const WA_WHAT = {
  create: { t: 'Create the agent', b: 'saboteur.near becomes the owner of a new agent account on NEAR Intents and signs its rules once. Gasless.' },
  grant: { t: 'Allow the game', b: 'Gives the game server permission to ask for payouts, valid for one year. It can only act inside the rules saboteur.near signed.' },
  rules: { t: 'Change rules', b: 'Signs fresh payout rules that fit the current prize: withdraw NEAR only, a weekly $ cap and a per-payment cap.' },
  withdraw_mode: { t: 'Withdraw to saboteur.near', b: 'Switches the agent to "send only to saboteur.near" and then sends everything there. Weekly payouts pause until you sign "Resume payouts".' },
  freeze: { t: 'Freeze the agent', b: 'Stops every outgoing payment at NEAR Intents until you unfreeze it.' },
  unfreeze: { t: 'Unfreeze the agent', b: 'Lets the agent pay again inside its rules.' },
};
async function waSign(kind, btn, extra = {}) {
  if (!waConnected()) { toast(`Connect ${WA.d.owner} first (button at the top).`, true); return null; }
  const w = WA_WHAT[kind];
  const g = await act(btn, () => api('/admin/weekly-agent/intent', { json: { kind, publicKey: WA.account.publicKey || null, ...extra } }));
  if (!g) return null;
  const pol = g.policy ? `<div class="kv" style="margin-top:10px"><span>Can do</span><b>${esc((g.policy.actions || []).join(', '))}</b><span>Assets</span><b>${esc(Array.isArray(g.policy.assets) ? g.policy.assets.join(', ') : g.policy.assets)}</b><span>Weekly cap</span><b>${g.policy.budget && g.policy.budget.weekly_usd ? '$' + esc(g.policy.budget.weekly_usd) : 'none'}</b><span>Sends to</span><b>${esc(g.policy.destinations && g.policy.destinations.mode === 'only' ? g.policy.destinations.list.map((x) => x.address).join(', ') + ' only' : 'any winner wallet')}</b></div>` : '';
  const depYocto = g.intent && g.intent.standard === 'nep366' ? (g.intent.payload.actions || []).reduce((a, x) => a + BigInt((x.params && x.params.deposit) || 0), 0n) : 0n;
  const depTxt = depYocto > 0n ? `${esc(WA.account.accountId)} pays <b>${(Number(depYocto / 10n ** 18n) / 1e6).toFixed(4)} NEAR</b> storage deposit (gas is sponsored). ` : 'No NEAR is spent. ';
  const okGo = await ask({ title: w.t + ' · sign', body: `${esc(w.b)}<div class="item" style="margin-top:10px"><p style="margin:0">${esc(g.summary)}</p></div>${pol}<p class="muted" style="font-size:12px;margin:10px 0 0">${depTxt}Your wallet (${esc(WA.account.accountId)}) opens next. Signing request expires ${esc(when(g.expiresAt).replace(' ago', ''))}.</p>`, ok: 'Sign with wallet' });
  if (!okGo) return null;
  const intent = g.intent;
  let signedData;
  try {
    if (intent.standard === 'nep366') {
      const r = await WA.wallet.signDelegateActions({ signerId: WA.d.owner, delegateActions: [intent.payload] });
      const sd = r && r.signedDelegateActions && r.signedDelegateActions[0];
      if (!sd) throw new Error('The wallet returned no signature.');
      signedData = { standard: intent.standard, payload: intent.payload, signed_delegate: typeof sd === 'string' ? sd : sd.signedDelegate || sd };
    } else if (intent.standard === 'nep413') {
      const nonce = Uint8Array.from(atob(intent.payload.nonce), (c) => c.charCodeAt(0));
      const r = await WA.wallet.signMessage({ message: intent.payload.message, recipient: intent.payload.recipient, nonce, signerId: WA.d.owner });
      signedData = { standard: intent.standard, payload: intent.payload, public_key: r.publicKey, signature: r.signature };
    } else throw new Error('This wallet type (' + intent.standard + ') is not supported here.');
  } catch (e) { toast('Not signed: ' + (e.message || e), true); return null; }
  toast('Signed. Waiting for NEAR Intents to confirm…');
  const r = await act(null, () => api('/admin/weekly-agent/submit', { json: { correlationId: g.correlationId, signedData } }));
  if (r) toast(r.status === 'SUCCESS' ? `${w.t}: done` : r.status === 'PROCESSING' ? `${w.t}: still confirming, this page updates by itself` : `${w.t}: ${r.status} ${r.failure || ''}`, !['SUCCESS', 'PROCESSING'].includes(r.status));
  load(false);
  return r;
}
ACT.waCreate = async (b) => {
  const d = WA.d;
  const ok = await ask({ title: 'Before you create the agent', body: `<p style="margin:0 0 10px">${esc(d.riskNotice)}</p><p style="margin:0 0 10px">Read and accept: <a href="${esc(d.ownerTermsUrl)}" target="_blank" rel="noopener">Owner Terms ↗</a> · <a href="${esc(d.outlayerTermsUrl)}" target="_blank" rel="noopener">OutLayer terms ↗</a></p><p class="muted" style="margin:0;font-size:12px">Clicking "I accept" records that ${esc(d.owner)} accepted them (time is saved).</p>`, ok: 'I accept' });
  if (!ok) return;
  await waSign('create', b, { termsAccepted: true });
};
ACT.waGrant = (b) => waSign('grant', b);
ACT.waRules = (b) => waSign('rules', b);
ACT.waFreeze = async (b) => { if (await ask({ title: 'Freeze the agent?', body: 'No payment can leave it until you unfreeze (one more signature). Unfreezing may have a short cooldown.', ok: 'Continue', danger: true })) waSign('freeze', b); };
ACT.waUnfreeze = (b) => waSign('unfreeze', b);
ACT.waWithdraw = async (b) => {
  const d = WA.d;
  if (d.mode === 'withdraw_to_owner') {
    if (!await ask({ title: `Send everything to ${d.owner}?`, body: `About <b>${num(d.balanceNear, 4)} NEAR</b> goes to ${esc(d.owner)}.`, ok: 'Send' })) return;
    await act(b, () => api('/admin/weekly-agent/withdraw-all', { method: 'POST' }), 'Withdrawal started'); load(false); return;
  }
  if (!await ask({ title: `Withdraw to ${d.owner}`, body: esc(WA_WHAT.withdraw_mode.b) + '<p class="muted" style="font-size:12px;margin:10px 0 0">Step 1: sign. Step 2: the server sends the full balance to ' + esc(d.owner) + ' automatically.</p>', ok: 'Continue' })) return;
  const r = await waSign('withdraw_mode', b);
  if (r && r.status === 'SUCCESS') { await act(null, () => api('/admin/weekly-agent/withdraw-all', { method: 'POST' }), 'Withdrawal started'); load(false); }
};
ACT.waFund = async (b) => {
  const d = WA.d;
  const dep = await act(b, () => api('/admin/weekly-agent/deposit', { method: 'POST' }));
  if (!dep) return;
  const canSend = waConnected();
  const v = await ask({ title: 'Add funds to the agent', body: `<p style="margin:0 0 10px">${esc(d.riskNotice)}</p>
    <div class="field"><label>DEPOSIT ADDRESS (NEAR MAINNET)</label><div class="item mono" style="word-break:break-all;margin:0">${esc(dep.address)}</div>${dep.memo ? `<div class="hint">Memo: <b>${esc(dep.memo)}</b> (required)</div>` : ''}</div>
    <p class="muted" style="font-size:12px;margin:0 0 10px">Send NEAR to this address from any wallet${dep.minAmount ? ` (at least ${esc(num(Number(dep.minAmount) / 1e24, 4))} NEAR)` : ''}. It shows in the agent balance in a minute or two. Address valid until ${esc(full(dep.expiresAt))}. Try a small amount first.</p>
    <button class="btn ghost" type="button" onclick="navigator.clipboard.writeText('${esc(dep.address)}')">Copy address</button>`,
    ok: canSend ? `Send from ${d.owner}` : false, cancel: 'Close', input: canSend ? { label: 'OR SEND NOW FROM THE CONNECTED WALLET (NEAR)', placeholder: 'e.g. 3', value: '' } : undefined });
  if (!v || !canSend) return;
  const amt = Number(v);
  if (!(amt > 0 && amt <= 1000)) { toast('Enter an amount in NEAR.', true); return; }
  const yocto = (BigInt(Math.round(amt * 1e6)) * 10n ** 18n).toString();
  await act(null, () => WA.wallet.signAndSendTransaction({ receiverId: dep.address, actions: [{ type: 'Transfer', params: { deposit: yocto } }] }), `Sent ${amt} NEAR. It shows in the balance in a minute or two.`);
};
ACT.waToggle = async (t) => {
  const d = WA.d;
  if (!d.enabled || d.stopAfterWeekEnd) { await act(null, () => api('/admin/weekly-agent/settings', { json: { enabled: true } }), 'Weekly rewards are ON'); load(false); return; }
  const m = $('#modal'), box = $('#mbox');
  box.innerHTML = `<h2>Switch weekly rewards off?</h2><div class="body">The prize banner disappears from Ranks right away. Remaining NEAR stays in the agent until you withdraw it.</div>
    <div class="acts" style="flex-direction:column;align-items:stretch"><button class="btn gold" id="waOffA">Pay this week, then stop</button><button class="btn red" id="waOffB">Stop now${d.current && d.current.status === 'countdown' ? ' (also cancels the countdown)' : ''}</button><button class="btn ghost" id="waOffC">Keep it on</button></div>`;

  const close = () => { m.classList.add('hidden'); box.innerHTML = ''; };

};
ACT.waPrize = async (b) => {
  const v = Number($('#waPrize').value);
  if (!(v >= 1 && v <= 10000)) { toast('Prize must be between $1 and $10,000.', true); return; }
  await act(b, () => api('/admin/weekly-agent/settings', { json: { prizeUsd: v } }), `Prize set to $${v}`);

R.weekly = async (el) => {

  const F = isFull();
  const price = d.nearPrice;
  const totalNear = price ? d.prizeUsd / price : null;
  const on = d.enabled && !d.stopAfterWeekEnd;

    ? `<span class="tag ok">✓ ${esc(WA.account.accountId)}</span>${F ? ` <button class="btn ghost" data-act="waDisconnect">Disconnect</button>` : ''}`

  const warns = [];

  if (d.pending && d.pending.status === 'PROCESSING') warns.push(`Waiting for NEAR Intents to confirm "${(WA_WHAT[d.pending.kind] || {}).t || d.pending.kind}"…`);
  if (d.pending && d.pending.error) warns.push(`Last signature (${(WA_WHAT[d.pending.kind] || {}).t || d.pending.kind}) failed: ${d.pending.error}`);
  if (d.needsRulesUpdate) warns.push(`The agent's caps are too low for a $${d.prizeUsd} prize. Click "Change rules (sign)".`);
  if (d.policy && d.policy.frozen) warns.push('The agent is FROZEN: no prize can be sent until you unfreeze it.');
  if (d.mode === 'withdraw_to_owner') warns.push(`The agent is in withdraw-to-${d.owner} mode: weekly payouts are paused. Sign "Resume payouts" to start again.`);
  if (d.ready && price && d.balanceNear != null && d.balanceNear < totalNear) warns.push(`The agent holds ${num(d.balanceNear, 3)} NEAR but this week's prize needs about ${num(totalNear, 3)} NEAR. Add funds.`);

  const note = await ask({ title: 'Private note (optional)', body: 'Only admins see this.', input: { label: 'NOTE', placeholder: 'What you found / did' }, ok: 'Save' });
  const reply = v.trim();
  await act(b, () => api(`/admin/reports/${b.dataset.id}/resolve`, { json: { note: note || '', replyMode: reply ? 'custom' : 'skip', replyText: reply } }), 'Resolved'); load(false);
};

/* inbox */
let ibQ = { page: 1, search: '', source: '' };
R.inbox = async (el, first) => {
  const to = STATE.msgTo;
  const d = await api(`/admin/inbox?page=${ibQ.page}&search=${encodeURIComponent(ibQ.search)}${ibQ.source ? '&source=' + ibQ.source : ''}`);
  const hist = `${d.messages.length ? d.messages.map((m) => `<div class="item"><div class="row"><span class="tag dim">${esc(m.nameTag || '')}</span><span class="t">${esc(m.title)}</span><small>→ ${esc(m.recipient ? (m.recipient.username ? '@' + m.recipient.username : m.recipient.name) : '?')} · ${when(m.createdAt)} · ${m.read ? 'read' : 'unread'} · ${esc(m.source || 'auto')}</small>${guard(`<button class="btn ghost" style="margin-left:auto" data-act="ibDel" data-id="${m._id}">Delete</button>`)}</div>${m.body ? `<p>${esc(m.body)}</p>` : ''}</div>`).join('') : '<div class="empty">No messages.</div>'}${pager(d.page, d.pages, (n) => { ibQ.page = n; load(false); })}`;
  if (first || !$('#ibHist')) {
    el.innerHTML = `${guard(`<div class="card"><h3>SEND TO ONE PLAYER</h3>
        <div class="field"><label>PLAYER</label><div class="row"><input class="in" id="ibTo" placeholder="Search name, @username or email" value="${esc(to ? to.name : '')}" style="max-width:340px"><span class="mono" id="ibToSel" style="color:var(--m)">${to ? '✓ ' + esc(to.name) : ''}</span></div><div id="ibRes" style="margin-top:6px"></div></div>
        <div class="field"><label>TITLE</label><input class="in" id="ibTitle" maxlength="120"></div>
        <div class="field"><label>MESSAGE</label><textarea class="in" id="ibBody" maxlength="2000"></textarea></div>
        <div class="field"><label>FROM (TAG)</label><input class="in" id="ibTag" value="NEAR Saboteur" style="max-width:240px"></div>
        <button class="btn solid" data-act="ibSend">Send to Inbox</button></div>`)}
      <div class="row"><input class="in" id="ibS" placeholder="Search sent messages…" value="${esc(ibQ.search)}" style="max-width:300px"><div class="chips">${[['', 'All'], ['manual', 'Sent by you'], ['auto', 'Automatic']].map(([k, t]) => `<button class="chip ${ibQ.source === k ? 'on' : ''}" data-act="ibSrc" data-k="${k}">${t}</button>`).join('')}</div></div><div id="ibHist">${hist}</div>`;
    let t; $('#ibS').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { ibQ.search = e.target.value.trim(); ibQ.page = 1; load(false); }, 300); };
    const ti = $('#ibTo'); if (ti) { let t2; ti.oninput = (e) => { STATE.msgTo = null; $('#ibToSel').textContent = ''; clearTimeout(t2); const q = e.target.value.trim(); if (!q) { $('#ibRes').innerHTML = ''; return; } t2 = setTimeout(async () => { const r = await api(`/admin/players?search=${encodeURIComponent(q)}`).catch(() => ({ players: [] })); $('#ibRes').innerHTML = r.players.slice(0, 6).map((p) => `<button class="chip" data-act="ibPick" data-id="${p._id}" data-n="${esc(p.name || p.username)}">${esc(p.name || '—')}${p.username ? ' @' + esc(p.username) : ''}</button>`).join(' ') || '<span class="muted">No match</span>'; }, 250); }; }
  } else $('#ibHist').innerHTML = hist;
};
ACT.ibPick = (b) => { STATE.msgTo = { id: b.dataset.id, name: b.dataset.n }; $('#ibTo').value = b.dataset.n; $('#ibToSel').textContent = '✓ ' + b.dataset.n; $('#ibRes').innerHTML = ''; };
ACT.ibSrc = (b) => { ibQ.source = b.dataset.k; ibQ.page = 1; load(true); };
ACT.ibSend = async (b) => {
  if (!STATE.msgTo) return toast('Pick a player from the search first.', true);
  const title = $('#ibTitle').value.trim(); if (!title) return toast('Title is required.', true);
  await act(b, () => api('/admin/inbox/send', { json: { playerId: STATE.msgTo.id, title, body: $('#ibBody').value.trim(), nameTag: $('#ibTag').value.trim() || 'NEAR Saboteur' } }), `Sent to ${STATE.msgTo.name}`);
  $('#ibTitle').value = ''; $('#ibBody').value = ''; load(false);
};
ACT.ibDel = async (b) => { if (!await ask({ title: 'Delete this message?', body: 'It disappears from the player\'s Inbox too.', ok: 'Delete', danger: true })) return; await act(b, () => api('/admin/inbox/' + b.dataset.id, { method: 'DELETE' }), 'Deleted'); load(false); };

/* news */
R.news = async (el) => {
  const d = await api('/admin/announcements');
  el.innerHTML = `${guard(`<div class="card"><h3>POST TO NEWS</h3>
      <div class="field"><label>TITLE</label><input class="in" id="nwT" maxlength="120"></div>
      <div class="field"><label>MESSAGE</label><textarea class="in" id="nwB" maxlength="2000"></textarea></div>
      <div class="grid2 even"><div class="field"><label>FROM (TAG)</label><input class="in" id="nwTag" value="NEAR Saboteur"></div><div class="field"><label>EXPIRES IN (DAYS)</label><input class="in" id="nwE" type="number" min="1" placeholder="empty = never"></div></div>
      <div class="field"><label>IMAGE URL (OPTIONAL)</label><input class="in" id="nwI" placeholder="https://…"></div>
      <button class="btn solid" data-act="nwPost">Post to everyone</button></div>`)}
    <div class="card"><h3>POSTED <span class="r">${d.announcements.length}</span></h3>${d.announcements.length ? d.announcements.map((a) => `<div class="item"><div class="row"><span class="t">${esc(a.title)}</span><small>· ${when(a.createdAt)}${a.expiresAt ? ' · expires ' + new Date(a.expiresAt).toLocaleDateString() : ''}</small>${guard(`<button class="btn ghost" style="margin-left:auto" data-act="nwDel" data-id="${a._id}">Delete</button>`)}</div>${a.body ? `<p>${esc(a.body)}</p>` : ''}</div>`).join('') : '<div class="empty">Nothing posted yet.</div>'}</div>`;
};
ACT.nwPost = async (b) => {
  const title = $('#nwT').value.trim(); if (!title) return toast('Title is required.', true);
  const img = $('#nwI').value.trim(); if (img && !/^https:\/\//.test(img)) return toast('Image URL must start with https://', true);
  if (!await ask({ title: 'Post to every player?', body: `"<b>${esc(title)}</b>" will show in everyone's News tab.`, ok: 'Post' })) return;
  await act(b, () => api('/admin/announcements', { json: { title, body: $('#nwB').value.trim(), nameTag: $('#nwTag').value.trim() || 'NEAR Saboteur', imageUrl: img || null, expiresInDays: $('#nwE').value || null } }), 'Posted'); load(true);
};
ACT.nwDel = async (b) => { if (!await ask({ title: 'Delete this post?', body: 'It disappears from News for everyone.', ok: 'Delete', danger: true })) return; await act(b, () => api('/admin/announcements/' + b.dataset.id, { method: 'DELETE' }), 'Deleted'); load(true); };

/* custom avatars */
let avPage = 1;
R.avatars = async (el) => {
  refreshCounts(); // badges update in the background - never hold the page
  const [c, d] = await Promise.all([api('/admin/custom-avatar-request/config'), api('/admin/custom-avatar-request/list?page=' + avPage)]);
  el.innerHTML = `<div class="grid2"><div class="card"><h3>REQUESTS <span class="r">${num(d.total)}</span></h3>${d.requests.length ? d.requests.map((r) => `<div class="item ${r.status === 'submitted' ? 'warn' : ''}"><div class="row"><span class="tag ${r.status === 'submitted' ? 'pass' : 'ok'}">${esc((r.status || '').toUpperCase())}</span><span class="t">${esc(r.playerName || '—')}</span><small>· ${when(r.createdAt)}${r.pricePaidNear ? ' · paid ' + r.pricePaidNear : ''}${r.telegramUsername ? ' · tg @' + esc(r.telegramUsername) : ''}</small></div>
      <p>${esc(r.description || '')}</p><div class="acts" style="margin-top:8px"><button class="btn ghost" data-act="avImg" data-id="${r._id}">View image</button>${guard(`<button class="btn" data-act="avReply" data-id="${r._id}">${r.adminReply ? 'Reply again' : 'Reply'}</button><button class="btn red" data-act="avDel" data-id="${r._id}">Delete</button>`)}</div>${r.adminReply ? `<p class="muted" style="font-size:12px">Your reply: "${esc(r.adminReply)}"</p>` : ''}</div>`).join('') + pager(d.page, d.pages, (n) => { avPage = n; load(false); }) : '<div class="empty">No requests yet.</div>'}</div>
    <div class="card"><h3>SETTINGS</h3>
      <div class="field"><label>PRICE (NEAR)</label><input class="in" id="avP" type="number" min="0" step="0.1" value="${c.priceNear}" ${isFull() ? '' : 'disabled'}></div>
      <div class="field"><label>TELEGRAM LINK</label><input class="in" id="avT" value="${esc(c.telegramLink || '')}" placeholder="https://t.me/…" ${isFull() ? '' : 'disabled'}><div class="hint">Shown to the player after they request, so you can talk about the design.</div></div>
      <div class="toggle ${c.enabled ? 'on' : ''}" id="avEn" ${isFull() ? 'data-act="avEn"' : ''} style="margin:4px 0 14px"><div class="sw"></div><b style="font-weight:600">${c.enabled ? 'Requests are ON' : 'Requests are OFF'}</b></div>
      ${guard('<button class="btn solid" data-act="avSave">Save</button>')}</div></div>`;
};
ACT.avEn = (t) => { t.classList.toggle('on'); t.querySelector('b').textContent = t.classList.contains('on') ? 'Requests are ON' : 'Requests are OFF'; };
ACT.avSave = async (b) => { const link = $('#avT').value.trim(); if (link && !/^https:\/\//.test(link)) return toast('Telegram link must start with https://', true); await act(b, () => api('/admin/custom-avatar-request/config', { json: { priceNear: Number($('#avP').value) || 0, telegramLink: link, enabled: $('#avEn').classList.contains('on') } }), 'Saved'); load(true); };
ACT.avImg = async (b) => {
  try { const r = await fetch(`/admin/custom-avatar-request/${b.dataset.id}/image`, { headers: { Authorization: 'Bearer ' + TOKEN } }); if (!r.ok) throw new Error('No image'); const url = URL.createObjectURL(await r.blob()); await ask({ title: 'Reference image', body: `<img src="${url}" alt="" style="max-width:100%;border-radius:6px">`, ok: false, cancel: 'Close' }); URL.revokeObjectURL(url); } catch (e) { toast(e.message, true); }
};
ACT.avReply = async (b) => { const v = await ask({ title: 'Reply to request', body: 'Goes to the player\'s Inbox.', input: { label: 'REPLY', textarea: true }, ok: 'Send' }); if (!v || !v.trim()) return; await act(b, () => api(`/admin/custom-avatar-request/${b.dataset.id}/reply`, { json: { reply: v.trim() } }), 'Reply sent'); load(false); };
ACT.avDel = async (b) => { if (!await ask({ title: 'Delete this request?', body: 'This can\'t be undone. It does not refund a payment.', ok: 'Delete', danger: true })) return; await act(b, () => api('/admin/custom-avatar-request/' + b.dataset.id, { method: 'DELETE' }), 'Deleted'); load(false); };

/* leaderboard */
let lbTab = 'weekly';
R.leaderboard = async (el) => {
  const d = await fetch('/leaderboard/' + lbTab).then((r) => r.json()).catch(() => ({ leaderboard: [] }));
  el.innerHTML = `<div class="row"><div class="chips">${['weekly', 'monthly'].map((k) => `<button class="chip ${lbTab === k ? 'on' : ''}" data-act="lbT" data-k="${k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div>${d.nextResetAt ? `<span class="muted mono">auto reset ${new Date(d.nextResetAt).toLocaleString()}</span>` : ''}${guard(`<button class="btn red" style="margin-left:auto" data-act="lbReset">Reset ${lbTab} now</button>`)}</div>
    <div class="card" style="padding:8px 10px">${(d.leaderboard || []).length ? `<div class="tbl"><table><tr><th>#</th><th>PLAYER</th><th>POINTS</th><th></th></tr>${d.leaderboard.map((p) => `<tr><td><b style="color:${p.rank <= 3 ? 'var(--g)' : 'inherit'}">${p.rank}</b></td><td class="who"><b>${esc(p.name || '—')}</b><small>${p.username ? '@' + esc(p.username) : ''}</small></td><td>${num(p.points)}</td><td>${p.hasPlayPass ? '<span class="tag pass">PASS</span>' : ''} ${p.hasLegionBadge ? '<span class="tag blue">LEGION</span>' : ''}</td></tr>`).join('')}</table></div>` : '<div class="empty">No points yet this period.</div>'}</div>`;
};
ACT.lbT = (b) => { lbTab = b.dataset.k; load(true); };
ACT.lbReset = async (b) => { if (!await ask({ title: `Reset the ${lbTab} leaderboard?`, body: 'The board starts again from zero right now. Players keep their match history and total points.', ok: 'Reset', danger: true })) return; await act(b, () => api('/admin/leaderboard/reset', { json: { type: lbTab } }), 'Leaderboard reset'); load(true); };

/* log */
let lgPage = 1;
R.log = async (el) => {
  const d = await api('/admin/action-log?page=' + lgPage);
  STATE.logs = d.logs;
  el.innerHTML = `<div class="card" style="padding:8px 10px">${d.logs.length ? `<div class="tbl"><table><tr><th>WHEN</th><th>ACTION</th><th>DETAILS</th></tr>${d.logs.map((l, i) => `<tr class="click" data-act="lgD" data-i="${i}"><td class="mono">${when(l.createdAt)}</td><td><span class="tag ${/fail|hold|refund|revoke|delete/.test(l.action) ? 'red' : /grant|purchas|gift/.test(l.action) ? 'pass' : 'dim'}">${esc(l.action)}</span></td><td class="muted" style="font-size:12px">${esc(Object.entries(l.details || {}).slice(0, 3).map(([k, v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' · ')).slice(0, 140)}</td></tr>`).join('')}</table></div>` : '<div class="empty">Nothing logged yet.</div>'}${pager(d.page, d.pages, (n) => { lgPage = n; load(false); })}</div>`;
};
ACT.lgD = (r) => { const l = STATE.logs[r.dataset.i]; if (!l) return; ask({ title: l.action, body: `<div class="muted mono" style="margin-bottom:10px">${full(l.createdAt)}</div><div class="kv">${Object.entries(l.details || {}).map(([k, v]) => `<span>${esc(k)}</span><b>${esc(typeof v === 'object' ? JSON.stringify(v) : String(v))}</b>`).join('') || '<span>—</span><b>No details</b>'}</div>`, ok: false, cancel: 'Close' }); };

/* system */
R.system = async (el) => {
  const db = await api('/admin/db-stats').catch(() => null);
  el.innerHTML = `<div class="grid2 even"><div class="card"><h3>BACKUPS</h3><p class="d">The free MongoDB has no automatic backups. Download a full copy regularly and keep it somewhere safe (not in the repo).</p><div class="acts"><button class="btn solid" data-act="dl" data-u="/admin/backup/export" data-n="backup.json">⬇ Full backup (JSON)</button><button class="btn" data-act="dl" data-u="/admin/export/csv?type=players" data-n="players.csv">Players CSV</button><button class="btn" data-act="dl" data-u="/admin/export/csv?type=matches" data-n="matches.csv">Matches CSV</button><button class="btn" data-act="dl" data-u="/admin/export/csv?type=funds" data-n="money.csv">Money CSV</button></div></div>
    <div class="card"><h3>DATABASE USAGE</h3>${db ? `<div class="kv"><span>Storage</span><b>${db.storageUsedMb} / ${db.storageLimitMb} MB (${db.percentUsed}%)</b><span>Data</span><b>${db.dataUsedMb} MB</b><span>Indexes</span><b>${db.indexUsedMb} MB</b><span>Collections</span><b>${db.collections}</b><span>Server up</span><b>${Math.round(db.serverUptimeSeconds / 60)} min</b></div><div class="bar"><span class="${db.percentUsed > 85 ? 'bad' : db.percentUsed > 60 ? 'warn' : ''}" style="width:${Math.min(100, db.percentUsed)}%"></span></div>` : '<div class="muted">Unavailable</div>'}</div></div>`;
};

/* ============ boot ============ */
function logout(silent) {
  if (!silent && TOKEN) fetch('/admin/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN } }).catch(() => {});
  TOKEN = null; localStorage.removeItem('nsAdminToken'); localStorage.removeItem('nsAdminRole');
  clearTimeout(timer); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
}
async function start() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  const [, pg, pr] = (location.hash || '').split('/');
  refreshCounts(); // badges update in the background - never hold the page
  go(PAGES[pg] ? pg : 'overview', pr ? decodeURIComponent(pr) : null, false);
}
$('#lbtn').onclick = async () => {
  const b = $('#lbtn'), e = $('#lerr'); e.classList.add('hidden');
  b.disabled = true; b.textContent = 'SIGNING IN…';
  try {
    const d = await api('/admin/login', { json: { username: $('#lu').value.trim(), password: $('#lp').value } });
    TOKEN = d.token; ROLE = d.role || 'full'; localStorage.setItem('nsAdminToken', TOKEN); localStorage.setItem('nsAdminRole', ROLE); $('#lp').value = '';
    start();
  } catch (err) { e.textContent = err.message; e.classList.remove('hidden'); }
  b.disabled = false; b.textContent = 'SIGN IN';
};
['#lu', '#lp'].forEach((s) => $(s).addEventListener('keydown', (ev) => { if (ev.key === 'Enter') $('#lbtn').click(); }));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && TOKEN && Date.now() - lastLoad > 15000) load(false); });
window.addEventListener('hashchange', () => { const [, pg, pr] = location.hash.split('/'); const p = pr ? decodeURIComponent(pr) : null; if (PAGES[pg] && (pg !== current || p !== param)) go(pg, p, false); });
if (TOKEN) start(); else $('#lu').focus();
})();
</script>
</body>
</html>
