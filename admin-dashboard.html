<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEAR Saboteur — Admin</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #05070a; color: #e8e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  /* ---------- Login screen ---------- */
  #loginScreen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #loginBox {
    width: 100%; max-width: 320px; background: linear-gradient(160deg, #0d1a14, #05100b);
    border: 1px solid rgba(110,255,192,0.3); border-radius: 16px; padding: 28px 22px;
  }
  #loginBox h1 { font-size: 18px; color: #6effc0; margin: 0 0 4px; text-align: center; }
  #loginBox p.sub { font-size: 12px; color: #7a8a86; margin: 0 0 20px; text-align: center; }
  #loginBox input {
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; padding: 11px 12px; color: #e8e8f0; font-size: 14px; margin-bottom: 10px;
  }
  #loginBox button {
    width: 100%; background: #6effc0; color: #05130d; border: none; border-radius: 8px;
    padding: 12px 0; font-size: 14px; font-weight: 800; margin-top: 6px;
  }
  #loginError { color: #ff8a8a; font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; }

  /* ---------- Dashboard shell ---------- */
  #dashboard { display: none; min-height: 100vh; flex-direction: column; }
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: #0a0d10; border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky; top: 0; z-index: 10;
  }
  #topbar h1 { font-size: 15px; color: #6effc0; margin: 0; }
  #logoutBtn {
    background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #9aa0ad;
    border-radius: 6px; padding: 6px 12px; font-size: 12px;
  }
  #tabs {
    display: flex; gap: 4px; padding: 8px 10px; background: #0a0d10;
    border-bottom: 1px solid rgba(255,255,255,0.08); overflow-x: auto; position: sticky; top: 49px; z-index: 9;
  }
  .tab-btn {
    background: transparent; border: none; color: #7a8a86; padding: 8px 14px;
    border-radius: 8px; font-size: 13px; font-weight: 700; white-space: nowrap;
  }
  .tab-btn.active { background: rgba(110,255,192,0.14); color: #6effc0; }
  #content { flex: 1; padding: 14px; max-width: 900px; width: 100%; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ---------- Shared bits ---------- */
  .card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 14px; margin-bottom: 10px;
  }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat-card {
    background: rgba(110,255,192,0.06); border: 1px solid rgba(110,255,192,0.25);
    border-radius: 12px; padding: 14px; text-align: center;
  }
  .stat-card .num { font-size: 26px; font-weight: 900; color: #fff; }
  .stat-card .label { font-size: 10px; color: #7fd9b8; font-weight: 700; letter-spacing: 0.4px; margin-top: 2px; }
  .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .search-row input {
    flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; padding: 9px 12px; color: #e8e8f0; font-size: 13px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: #7a8a86; font-weight: 700; padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 10.5px; }
  td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.06); color: #e8e8f0; }
  tr.clickable { cursor: pointer; }
  tr.clickable:active { background: rgba(110,255,192,0.06); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 800;
  }
  .badge.win { background: rgba(110,255,192,0.18); color: #6effc0; }
  .badge.loss { background: rgba(255,120,120,0.15); color: #ff8a8a; }
  .badge.saboteur { background: rgba(255,140,80,0.15); color: #ffab6b; }
  .badge.crewmate { background: rgba(110,180,255,0.15); color: #8fc4ff; }
  .badge.live { background: rgba(255,215,80,0.18); color: #ffd75e; }
  .pager { display: flex; justify-content: center; gap: 10px; margin-top: 12px; align-items: center; }
  .pager button {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #e8e8f0;
    border-radius: 6px; padding: 6px 12px; font-size: 12px;
  }
  .pager button:disabled { opacity: 0.35; }
  .empty-note { color: #5f6b67; font-size: 12px; text-align: center; padding: 24px 0; }
  .room-players { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .room-player-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: rgba(255,255,255,0.03); border-radius: 8px; padding: 6px 10px; font-size: 11.5px;
  }
  .back-link { color: #6effc0; font-size: 12px; margin-bottom: 10px; display: inline-block; cursor: pointer; }
</style>
</head>
<body>

<div id="loginScreen">
  <div id="loginBox">
    <h1>NEAR Saboteur</h1>
    <p class="sub">Admin Dashboard</p>
    <input id="loginUsername" placeholder="Username" autocomplete="username" />
    <input id="loginPassword" placeholder="Password" type="password" autocomplete="current-password" />
    <button id="loginBtn">Log In</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="dashboard">
  <div id="topbar">
    <h1>NEAR Saboteur Admin</h1>
    <button id="logoutBtn">Log out</button>
  </div>
  <div id="tabs">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="live">Live</button>
    <button class="tab-btn" data-tab="matches">Matches</button>
    <button class="tab-btn" data-tab="players">Players</button>
  </div>
  <div id="content">
    <div class="panel active" id="panel-overview">
      <div class="stat-grid" id="overviewStats"></div>
    </div>

    <div class="panel" id="panel-live">
      <div id="liveRoomsList"></div>
      <div id="liveRoomDetail" style="display:none;"></div>
    </div>

    <div class="panel" id="panel-matches">
      <div class="search-row">
        <input id="matchSearch" placeholder="Search by player or room code" />
      </div>
      <div id="matchesTableWrap"></div>
      <div class="pager" id="matchesPager"></div>
    </div>

    <div class="panel" id="panel-players">
      <div id="playersListView">
        <div class="search-row">
          <input id="playerSearch" placeholder="Search by name, username, or email" />
        </div>
        <div id="playersTableWrap"></div>
        <div class="pager" id="playersPager"></div>
      </div>
      <div id="playerDetailView" style="display:none;"></div>
    </div>
  </div>
</div>

<script>
  let adminToken = localStorage.getItem('nsAdminToken') || null;
  let matchesPage = 1, playersPage = 1;
  let liveRoomsPollTimer = null, liveRoomDetailPollTimer = null, expandedRoomCode = null;

  function apiFetch(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, adminToken ? { Authorization: 'Bearer ' + adminToken } : {});
    return fetch(path, opts).then(async (r) => {
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.message || 'Request failed');
      return data;
    });
  }

  function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    loadOverview();
    startLiveRoomsPolling();
  }
  function showLogin() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    stopLiveRoomsPolling();
  }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    try {
      const data = await apiFetch('/admin/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      adminToken = data.token;
      localStorage.setItem('nsAdminToken', adminToken);
      showDashboard();
    } catch (e) {
      errEl.textContent = e.message;
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    try { await apiFetch('/admin/logout', { method: 'POST' }); } catch (e) {}
    adminToken = null;
    localStorage.removeItem('nsAdminToken');
    showLogin();
  });

  // ---------- Tabs ----------
  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'overview') loadOverview();
      if (btn.dataset.tab === 'matches') loadMatches();
      if (btn.dataset.tab === 'players') { document.getElementById('playerDetailView').style.display = 'none'; document.getElementById('playersListView').style.display = 'block'; loadPlayers(); }
      if (btn.dataset.tab === 'live') { expandedRoomCode = null; document.getElementById('liveRoomDetail').style.display = 'none'; document.getElementById('liveRoomsList').style.display = 'block'; }
    });
  });

  // ---------- Overview ----------
  async function loadOverview() {
    try {
      const d = await apiFetch('/admin/overview');
      document.getElementById('overviewStats').innerHTML = `
        <div class="stat-card"><div class="num">${d.totalPlayers}</div><div class="label">TOTAL PLAYERS</div></div>
        <div class="stat-card"><div class="num">${d.totalMatches}</div><div class="label">TOTAL MATCHES</div></div>
        <div class="stat-card"><div class="num">${d.matchesToday}</div><div class="label">MATCHES TODAY</div></div>
        <div class="stat-card"><div class="num">${d.activeRooms}</div><div class="label">ACTIVE ROOMS</div></div>
        <div class="stat-card"><div class="num">${d.activeGames}</div><div class="label">GAMES IN PROGRESS</div></div>
      `;
    } catch (e) { handleAuthError(e); }
  }

  // ---------- Live rooms ----------
  function startLiveRoomsPolling() {
    pollLiveRooms();
    liveRoomsPollTimer = setInterval(pollLiveRooms, 4000);
  }
  function stopLiveRoomsPolling() {
    clearInterval(liveRoomsPollTimer);
    clearInterval(liveRoomDetailPollTimer);
  }
  async function pollLiveRooms() {
    if (expandedRoomCode) { pollLiveRoomDetail(); return; }
    try {
      const d = await apiFetch('/admin/live-rooms');
      const list = document.getElementById('liveRoomsList');
      if (!d.rooms.length) {
        list.innerHTML = '<div class="empty-note">No active rooms right now.</div>';
        return;
      }
      list.innerHTML = d.rooms.map((r) => `
        <div class="card clickable" onclick="openRoom('${r.code}')">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <span style="font-family:monospace;font-weight:800;font-size:14px;">${r.code}</span>
              ${r.gameStarted ? '<span class="badge live">IN PROGRESS</span>' : '<span class="badge crewmate">LOBBY</span>'}
              ${r.inMeeting ? '<span class="badge saboteur">MEETING</span>' : ''}
            </div>
            <span style="font-size:12px;color:#9aa0ad;">${r.playerCount} player${r.playerCount === 1 ? '' : 's'}</span>
          </div>
        </div>
      `).join('');
    } catch (e) { handleAuthError(e); }
  }
  window.openRoom = function (code) {
    expandedRoomCode = code;
    document.getElementById('liveRoomsList').style.display = 'none';
    document.getElementById('liveRoomDetail').style.display = 'block';
    pollLiveRoomDetail();
  };
  window.closeRoom = function () {
    expandedRoomCode = null;
    document.getElementById('liveRoomDetail').style.display = 'none';
    document.getElementById('liveRoomsList').style.display = 'block';
  };
  async function pollLiveRoomDetail() {
    if (!expandedRoomCode) return;
    try {
      const r = await apiFetch('/admin/live-rooms/' + expandedRoomCode);
      const wrap = document.getElementById('liveRoomDetail');
      wrap.innerHTML = `
        <span class="back-link" onclick="closeRoom()">&larr; Back to all rooms</span>
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <span style="font-family:monospace;font-weight:800;font-size:16px;">${r.code}</span>
            ${r.gameStarted ? '<span class="badge live">IN PROGRESS</span>' : '<span class="badge crewmate">LOBBY</span>'}
          </div>
          ${r.winner ? `<div style="font-size:12px;color:#6effc0;">Winner: ${r.winner}</div>` : ''}
          ${r.inMeeting ? '<div style="font-size:12px;color:#ffab6b;">Meeting in progress</div>' : ''}
          <div class="room-players">
            ${r.players.map((p) => `
              <div class="room-player-row">
                <div>
                  <strong>${p.name || '(unnamed)'}</strong>
                  ${p.isHost ? ' <span style="color:#7a8a86;">(host)</span>' : ''}
                  ${p.isGuest ? ' <span style="color:#7a8a86;">(guest)</span>' : ''}
                  ${p.disconnected ? ' <span style="color:#ff8a8a;">(disconnected)</span>' : ''}
                  ${p.role ? `<span class="badge ${p.role}">${p.role.toUpperCase()}</span>` : ''}
                  ${r.gameStarted && !p.alive ? '<span class="badge loss">DEAD</span>' : ''}
                </div>
                <div style="text-align:right;color:#9aa0ad;">
                  ${p.role === 'crewmate' ? `${p.missionsDone}/${p.missionsTotal} missions` : ''}
                  ${p.role === 'saboteur' ? `${p.killsCount} kills` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
        ${r.roomLeaderboard && r.roomLeaderboard.length ? `
          <div class="card">
            <h3 style="margin:0 0 8px;font-size:13px;color:#ffd75e;">Room Leaderboard</h3>
            ${r.roomLeaderboard.map((entry, i) => `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
                <div>
                  <span style="font-weight:800;color:${i === 0 ? '#ffd75e' : '#e8e8f0'};">#${i + 1} ${entry.name || 'Player'}</span>
                  ${!entry.present ? ' <span style="color:#7a8a86;font-size:10px;">(left)</span>' : ''}
                  <div style="font-size:10px;color:#7fd9b8;">@${entry.username || 'player'} · ${entry.matches.length} match${entry.matches.length === 1 ? '' : 'es'}</div>
                </div>
                <span style="font-size:15px;font-weight:900;color:#ffd75e;">${entry.totalPoints}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
      `;
    } catch (e) {
      if (e.message.includes('not found')) {
        document.getElementById('liveRoomDetail').innerHTML = `<span class="back-link" onclick="closeRoom()">&larr; Back to all rooms</span><div class="empty-note">This room has ended.</div>`;
      } else {
        handleAuthError(e);
      }
    }
  }

  // ---------- Matches ----------
  let matchSearchTimer = null;
  document.getElementById('matchSearch').addEventListener('input', () => {
    clearTimeout(matchSearchTimer);
    matchSearchTimer = setTimeout(() => { matchesPage = 1; loadMatches(); }, 350);
  });
  async function loadMatches() {
    try {
      const search = document.getElementById('matchSearch').value.trim();
      const d = await apiFetch(`/admin/matches?page=${matchesPage}&search=${encodeURIComponent(search)}`);
      const wrap = document.getElementById('matchesTableWrap');
      if (!d.matches.length) {
        wrap.innerHTML = '<div class="empty-note">No matches found.</div>';
      } else {
        wrap.innerHTML = `
          <table>
            <tr><th>Player</th><th>Room</th><th>Role</th><th>Result</th><th>Points</th><th>Date</th></tr>
            ${d.matches.map((m) => `
              <tr>
                <td>${m.playerName || '—'}</td>
                <td style="font-family:monospace;">${m.roomCode || '—'}</td>
                <td><span class="badge ${m.role}">${(m.role || '—').toUpperCase()}</span></td>
                <td><span class="badge ${m.won ? 'win' : 'loss'}">${m.won ? 'WON' : 'LOST'}</span></td>
                <td>${m.points}${m.reduced ? ' <span style="color:#7a8a86;">(reduced)</span>' : ''}</td>
                <td style="color:#9aa0ad;">${new Date(m.earnedAt).toLocaleDateString()} ${new Date(m.earnedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
              </tr>
            `).join('')}
          </table>
        `;
      }
      renderPager('matchesPager', d.page, d.pages, (p) => { matchesPage = p; loadMatches(); });
    } catch (e) { handleAuthError(e); }
  }

  // ---------- Players ----------
  let playerSearchTimer = null;
  document.getElementById('playerSearch').addEventListener('input', () => {
    clearTimeout(playerSearchTimer);
    playerSearchTimer = setTimeout(() => { playersPage = 1; loadPlayers(); }, 350);
  });
  async function loadPlayers() {
    try {
      const search = document.getElementById('playerSearch').value.trim();
      const d = await apiFetch(`/admin/players?page=${playersPage}&search=${encodeURIComponent(search)}`);
      const wrap = document.getElementById('playersTableWrap');
      if (!d.players.length) {
        wrap.innerHTML = '<div class="empty-note">No players found.</div>';
      } else {
        wrap.innerHTML = `
          <table>
            <tr><th>Name</th><th>Username</th><th>Points</th><th>Games</th><th>Wins</th></tr>
            ${d.players.map((p) => `
              <tr class="clickable" onclick="openPlayer('${p._id}')">
                <td>${p.name || '(no name)'}</td>
                <td>${p.username ? '@' + p.username : '—'}</td>
                <td>${p.totalPoints}</td>
                <td>${p.gamesPlayed}</td>
                <td>${p.gamesWon}</td>
              </tr>
            `).join('')}
          </table>
        `;
      }
      renderPager('playersPager', d.page, d.pages, (p) => { playersPage = p; loadPlayers(); });
    } catch (e) { handleAuthError(e); }
  }
  window.openPlayer = async function (id) {
    try {
      const d = await apiFetch('/admin/players/' + id);
      document.getElementById('playersListView').style.display = 'none';
      const view = document.getElementById('playerDetailView');
      view.style.display = 'block';
      view.innerHTML = `
        <span class="back-link" onclick="backToPlayers()">&larr; Back to players</span>
        <div class="card">
          <h2 style="margin:0 0 4px;font-size:16px;color:#fff;">${d.player.name || '(no name)'}</h2>
          <p style="margin:0 0 10px;color:#9aa0ad;font-size:12px;">${d.player.username ? '@' + d.player.username : ''} · ${d.player.email}</p>
          <div class="stat-grid">
            <div class="stat-card"><div class="num">${d.player.totalPoints}</div><div class="label">TOTAL POINTS</div></div>
            <div class="stat-card"><div class="num">${d.player.currentSeasonPoints}</div><div class="label">SEASON POINTS</div></div>
            <div class="stat-card"><div class="num">${d.player.gamesPlayed}</div><div class="label">GAMES PLAYED</div></div>
            <div class="stat-card"><div class="num">${d.player.gamesWon}</div><div class="label">GAMES WON</div></div>
          </div>
        </div>
        <div class="card">
          <h3 style="margin:0 0 8px;font-size:13px;color:#6effc0;">Recent Matches</h3>
          ${d.matches.length ? `
            <table>
              <tr><th>Room</th><th>Role</th><th>Result</th><th>Points</th><th>Date</th></tr>
              ${d.matches.map((m) => `
                <tr>
                  <td style="font-family:monospace;">${m.roomCode || '—'}</td>
                  <td><span class="badge ${m.role}">${(m.role || '—').toUpperCase()}</span></td>
                  <td><span class="badge ${m.won ? 'win' : 'loss'}">${m.won ? 'WON' : 'LOST'}</span></td>
                  <td>${m.points}</td>
                  <td style="color:#9aa0ad;">${new Date(m.earnedAt).toLocaleDateString()}</td>
                </tr>
              `).join('')}
            </table>
          ` : '<div class="empty-note">No matches yet.</div>'}
        </div>
      `;
    } catch (e) { handleAuthError(e); }
  };
  window.backToPlayers = function () {
    document.getElementById('playerDetailView').style.display = 'none';
    document.getElementById('playersListView').style.display = 'block';
  };

  // ---------- Shared helpers ----------
  function renderPager(elId, page, pages, onGo) {
    const el = document.getElementById(elId);
    if (pages <= 1) { el.innerHTML = ''; return; }
    el.innerHTML = '';
    const prevBtn = document.createElement('button');
    prevBtn.textContent = 'Prev';
    prevBtn.disabled = page <= 1;
    prevBtn.onclick = () => onGo(page - 1);
    const label = document.createElement('span');
    label.style.fontSize = '12px'; label.style.color = '#9aa0ad';
    label.textContent = `Page ${page} of ${pages}`;
    const nextBtn = document.createElement('button');
    nextBtn.textContent = 'Next';
    nextBtn.disabled = page >= pages;
    nextBtn.onclick = () => onGo(page + 1);
    el.appendChild(prevBtn); el.appendChild(label); el.appendChild(nextBtn);
  }
  function handleAuthError(e) {
    if (e.message === 'Not logged in.') {
      adminToken = null;
      localStorage.removeItem('nsAdminToken');
      showLogin();
    }
  }

  // ---------- Boot ----------
  if (adminToken) {
    showDashboard();
  } else {
    showLogin();
  }
</script>

</body>
</html>
