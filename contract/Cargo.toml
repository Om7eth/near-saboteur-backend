[package]
name = "near_saboteur_pool"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# [BUG FIX - VERSION DRIFT] Was "5.5.0" (semver-caret, meaning "any 5.x.y
# >= 5.5.0") with no Cargo.lock committed to the repo - every single
# build could silently resolve to a DIFFERENT, newer near-sdk patch/minor
# version than whatever this code was actually written and last verified
# against. This was confirmed happening: a build log showed near-sdk
# resolving to 5.28.3 - many versions ahead of 5.5.0, and near-sdk has
# had real internal changes to its contract-state/macro-generated code
# across versions in that range. Pinned to an EXACT version with `=` so
# every future build is byte-for-byte reproducible - this alone could be
# the actual explanation for the persistent, unexplained WasmTrap seen on
# every state-reading call, if a newer near-sdk version handles
# `#[near(contract_state)]`'s internal Default/state-read fallback
# differently than 5.5.0 did.
near-sdk = { version = "=5.5.0", features = ["legacy"] }
borsh = "1.5"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
overflow-checks = true
strip = true
