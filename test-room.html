<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEAR Saboteur - Room Test</title>
  <!-- Server apni khud ki socket.io client library deta hai is path pe -->
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 16px; }
    h2 { color: #7fdfff; }
    input, button { font-size: 16px; padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    button { background: #2a6; color: white; border: none; border-radius: 6px; }
    #log { background: #000; padding: 8px; height: 200px; overflow-y: scroll; font-size: 12px; margin-top: 10px; }
    .player { padding: 4px; border-bottom: 1px solid #333; }
    #moveArea { position: relative; width: 100%; height: 260px; background: #1a1a2e; border: 2px solid #444; border-radius: 8px; overflow: hidden; touch-action: none; }
    .dot { position: absolute; width: 30px; height: 30px; border-radius: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; font-size: 10px; color: white; }
    #myDot { background: #2a6; border: 2px solid white; }
    .otherDot { background: #a33; }
  </style>
</head>
<body>
  <h2>🧪 NEAR Saboteur - Room Test</h2>

  <!-- Apna server ka URL yahan daalo -->
  <input id="serverUrl" value="https://near-saboteur-backend.onrender.com" placeholder="Server URL" />
  <button onclick="connectServer()">1. Connect to Server</button>

  <input id="playerName" placeholder="Tumhara naam" value="Om7eth" />
  <input id="avatarId" placeholder="Avatar ID (e.g. purple)" value="purple" />

  <button onclick="createRoom()">2. Create New Room</button>

  <input id="joinCode" placeholder="Room code daalo (join karne ke liye)" />
  <button onclick="joinRoom()">3. Join Room</button>

  <button onclick="startGame()" style="background:#a33;">4. Start Game (host only)</button>

  <h3>Room Code: <span id="roomCode">-</span></h3>
  <h3>My Role: <span id="myRole">-</span></h3>
  <h3>Players in room:</h3>
  <div id="players"></div>

  <h3>🕹️ Movement Test (yahan tap/drag karo)</h3>
  <div id="moveArea">
    <div id="myDot"></div>
  </div>
  <div id="otherDots"></div>

  <h3>Log:</h3>
  <div id="log"></div>

  <script>
    let socket = null;

    function log(msg) {
      const logDiv = document.getElementById("log");
      logDiv.innerHTML += msg + "<br>";
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function connectServer() {
      try {
        log("⏳ Connecting...");
        const url = document.getElementById("serverUrl").value;
        socket = io(url);

        socket.on("connect", () => {
          log("✅ Connected to server! Socket ID: " + socket.id);
        });

        socket.on("connect_error", (err) => {
          log("🔥 Connect error: " + err.message);
        });

        socket.on("disconnect", () => {
          log("❌ Disconnected from server.");
        });

        socket.on("roomCreated", (data) => {
          log("🏠 Room created: " + data.code);
          document.getElementById("roomCode").innerText = data.code;
          renderPlayers(data.players);
        });

        socket.on("roomJoined", (data) => {
          log("🚪 Joined room: " + data.code);
          document.getElementById("roomCode").innerText = data.code;
          renderPlayers(data.players);
        });

        socket.on("joinError", (data) => {
          log("⚠️ Error: " + data.message);
        });

        socket.on("startGameError", (data) => {
          log("⚠️ Start game error: " + data.message);
        });

        socket.on("roleAssigned", (data) => {
          log("🎭 Tumhara role: " + data.role.toUpperCase());
          document.getElementById("myRole").innerText = data.role.toUpperCase();
        });

        socket.on("playerListUpdated", (data) => {
          log("🔄 Player list updated. Total: " + data.players.length);
          renderPlayers(data.players);
        });

        socket.on("playerMoved", (data) => {
          showOtherDot(data.id, data.x, data.y);
        });
      } catch (e) {
        log("🔥 JS Error: " + e.message);
      }
    }

    function renderPlayers(players) {
      const div = document.getElementById("players");
      div.innerHTML = "";
      players.forEach((p) => {
        div.innerHTML += `<div class="player">${p.isHost ? "👑" : "👤"} ${p.name} (${p.avatarId})</div>`;
      });
    }

    function createRoom() {
      if (!socket) { log("⚠️ Pehle connect karo!"); return; }
      const name = document.getElementById("playerName").value;
      const avatarId = document.getElementById("avatarId").value;
      socket.emit("createRoom", { name, avatarId });
    }

    function joinRoom() {
      if (!socket) { log("⚠️ Pehle connect karo!"); return; }
      const name = document.getElementById("playerName").value;
      const avatarId = document.getElementById("avatarId").value;
      const code = document.getElementById("joinCode").value;
      socket.emit("joinRoom", { code, name, avatarId });
    }

    function startGame() {
      if (!socket) { log("⚠️ Pehle connect karo!"); return; }
      log("🚀 Starting game...");
      socket.emit("startGame", { imposterCount: 1 });
    }

    // ---- Movement test logic ----
    const moveArea = document.getElementById("moveArea");
    const myDot = document.getElementById("myDot");
    const otherDotsDiv = document.getElementById("otherDots");
    const otherDots = {}; // socket.id -> dot element

    function moveMyDotTo(clientX, clientY) {
      const rect = moveArea.getBoundingClientRect();
      let x = clientX - rect.left;
      let y = clientY - rect.top;
      x = Math.max(0, Math.min(x, rect.width));
      y = Math.max(0, Math.min(y, rect.height));

      myDot.style.left = x + "px";
      myDot.style.top = y + "px";

      if (socket) {
        socket.emit("playerMove", { x, y });
      }
    }

    moveArea.addEventListener("touchmove", (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      moveMyDotTo(touch.clientX, touch.clientY);
    });
    moveArea.addEventListener("touchstart", (e) => {
      const touch = e.touches[0];
      moveMyDotTo(touch.clientX, touch.clientY);
    });
    moveArea.addEventListener("mousedown", (e) => moveMyDotTo(e.clientX, e.clientY));

    function showOtherDot(id, x, y) {
      let dot = otherDots[id];
      if (!dot) {
        dot = document.createElement("div");
        dot.className = "dot otherDot";
        dot.innerText = id.slice(0, 3);
        otherDotsDiv.appendChild(dot);
        otherDots[id] = dot;
      }
      // moveArea ke andar dot ko absolute position karna hai, lekin woh
      // alag div mein hai - isliye moveArea ke top-left ke relative offset use karte hain
      const rect = moveArea.getBoundingClientRect();
      dot.style.position = "fixed";
      dot.style.left = (rect.left + x) + "px";
      dot.style.top = (rect.top + y) + "px";
    }
  </script>
</body>
</html>
