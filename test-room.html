<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEAR Saboteur - Room Test</title>
  <!-- Server apni khud ki socket.io client library deta hai is path pe -->
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 16px; }
    h2 { color: #7fdfff; }
    input, button { font-size: 16px; padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    button { background: #2a6; color: white; border: none; border-radius: 6px; }
    #log { background: #000; padding: 8px; height: 200px; overflow-y: scroll; font-size: 12px; margin-top: 10px; }
    .player { padding: 4px; border-bottom: 1px solid #333; }
  </style>
</head>
<body>
  <h2>🧪 NEAR Saboteur - Room Test</h2>

  <!-- Apna server ka URL yahan daalo -->
  <input id="serverUrl" value="https://near-saboteur-backend.onrender.com" placeholder="Server URL" />
  <button onclick="connectServer()">1. Connect to Server</button>

  <input id="playerName" placeholder="Tumhara naam" value="Om7eth" />
  <input id="avatarId" placeholder="Avatar ID (e.g. purple)" value="purple" />

  <button onclick="createRoom()">2. Create New Room</button>

  <input id="joinCode" placeholder="Room code daalo (join karne ke liye)" />
  <button onclick="joinRoom()">3. Join Room</button>

  <h3>Room Code: <span id="roomCode">-</span></h3>
  <h3>Players in room:</h3>
  <div id="players"></div>

  <h3>Log:</h3>
  <div id="log"></div>

  <script>
    let socket = null;

    function log(msg) {
      const logDiv = document.getElementById("log");
      logDiv.innerHTML += msg + "<br>";
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function connectServer() {
      try {
        log("⏳ Connecting...");
        const url = document.getElementById("serverUrl").value;
        socket = io(url);

        socket.on("connect", () => {
          log("✅ Connected to server! Socket ID: " + socket.id);
        });

        socket.on("connect_error", (err) => {
          log("🔥 Connect error: " + err.message);
        });

        socket.on("disconnect", () => {
          log("❌ Disconnected from server.");
        });

        socket.on("roomCreated", (data) => {
          log("🏠 Room created: " + data.code);
          document.getElementById("roomCode").innerText = data.code;
          renderPlayers(data.players);
        });

        socket.on("roomJoined", (data) => {
          log("🚪 Joined room: " + data.code);
          document.getElementById("roomCode").innerText = data.code;
          renderPlayers(data.players);
        });

        socket.on("joinError", (data) => {
          log("⚠️ Error: " + data.message);
        });

        socket.on("playerListUpdated", (data) => {
          log("🔄 Player list updated. Total: " + data.players.length);
          renderPlayers(data.players);
        });
      } catch (e) {
        log("🔥 JS Error: " + e.message);
      }
    }

    function renderPlayers(players) {
      const div = document.getElementById("players");
      div.innerHTML = "";
      players.forEach((p) => {
        div.innerHTML += `<div class="player">${p.isHost ? "👑" : "👤"} ${p.name} (${p.avatarId})</div>`;
      });
    }

    function createRoom() {
      if (!socket) { log("⚠️ Pehle connect karo!"); return; }
      const name = document.getElementById("playerName").value;
      const avatarId = document.getElementById("avatarId").value;
      socket.emit("createRoom", { name, avatarId });
    }

    function joinRoom() {
      if (!socket) { log("⚠️ Pehle connect karo!"); return; }
      const name = document.getElementById("playerName").value;
      const avatarId = document.getElementById("avatarId").value;
      const code = document.getElementById("joinCode").value;
      socket.emit("joinRoom", { code, name, avatarId });
    }
  </script>
</body>
</html>
