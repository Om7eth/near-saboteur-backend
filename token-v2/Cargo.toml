[package]
name = "saboteur_token_v2"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.26.1", features = ["legacy"] }
near-contract-standards = "=5.26.1"

[dev-dependencies]
near-sdk = { version = "=5.26.1", features = ["legacy", "unit-testing"] }

[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
