name: Build and Deploy Pool Contract

# [MOBILE-ONLY WORKFLOW] Triggered manually from the "Actions" tab in
# the GitHub app (or github.com in a mobile browser) - tap "Run
# workflow", fill in the account IDs, tap the green button. Everything
# below runs on GitHub's own servers, not on your phone - no computer,
# no terminal, needed on your end at all.
on:
  workflow_dispatch:
    inputs:
      network:
        description: "Which NEAR network to deploy to"
        required: true
        default: "testnet"
        type: choice
        options:
          - testnet
          - mainnet
      contract_account_id:
        description: "The NEAR account this contract lives on (e.g. nearsaboteurpool.testnet)"
        required: true
        type: string
      owner_account_id:
        description: "The account allowed to call owner-only functions (usually your own wallet)"
        required: true
        type: string
      oracle_account_id:
        description: "The account the game backend uses to report match points"
        required: true
        type: string
      run_init:
        description: "Run the one-time 'new' setup call after deploying? (turn OFF if re-deploying an already-initialized contract)"
        required: true
        default: true
        type: boolean

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned to a specific Rust version safely above near-sdk 5.26.1's
      # own minimum (1.86) - avoids both "stable" drifting to some future
      # untested version, and being pinned too far behind what the SDK
      # or its dependencies eventually require.
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.93.0
          target: wasm32-unknown-unknown
          override: true

      # [BUG FIX - STALE DEPLOYS] There used to be a cache step here
      # (actions/cache, keyed only on Cargo.lock's hash) meant to speed
      # up repeat builds. The bug: that key never changes just because
      # lib.rs changes - only actual dependency changes touch
      # Cargo.lock - so editing lib.rs alone (which is ALL that ever
      # happened across many redeploys in this project) could restore a
      # stale contract/target build-output cache whose files can end up
      # with newer-looking timestamps than the freshly checked-out
      # source, tricking Cargo's incremental compiler into skipping a
      # real rebuild entirely. The workflow still reported success and
      # still ran `near deploy` - it was just silently redeploying the
      # SAME OLD WASM every time, no matter what lib.rs actually said.
      # Removed entirely rather than reworking the cache key, since a
      # contract this small builds in well under 15 seconds anyway - not
      # worth reintroducing any risk of this exact bug recurring for a
      # marginal speed gain.
      - name: Build contract (WASM)
        working-directory: contract
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # [BUG FIX - SILENT DEPLOY FAILURE] Root cause of a real, very
      # costly bug: `near-cli` (the old, deprecated JS CLI) was being
      # installed fresh with no version pin every single run
      # (`npm install -g near-cli` always grabs whatever's currently
      # published as "latest"). At some point its `near deploy <account>
      # <path>` command style evidently stopped actually deploying
      # anything - but also never printed an error and never made this
      # step exit non-zero, so the workflow kept reporting a clean green
      # success on every run while nearsaboteurcontractv2.testnet's own
      # transaction history shows exactly ONE DeployContract action ever,
      # from its very first setup - every "successful" redeploy after
      # that (the panic=abort removal, the diagnostic logging, the
      # debug_check_join addition) never actually reached the chain.
      # Replaced entirely with a small script using near-api-js directly
      # - the same library the game itself already depends on for every
      # other chain interaction, so its behavior is exactly as trustworthy
      # as the rest of this project's own on-chain calls. It prints the
      # real transaction hash on success and, critically, THROWS (making
      # this step, and the whole job, fail loudly and visibly) on any
      # problem - no more silent no-ops.
      # [UPDATED - LATEST TOOLING, JULY 2026] near-api-js v7 replaced the
      # old connect()/keyStores pattern entirely - an Account now takes
      # its private key directly, no separate in-memory keystore needed.
      - name: Install deploy script dependencies
        run: npm install near-api-js@7

      - name: Deploy contract WASM + run setup call
        env:
          NEAR_NETWORK: ${{ github.event.inputs.network }}
          CONTRACT_ACCOUNT_ID: ${{ github.event.inputs.contract_account_id }}
          OWNER_ACCOUNT_ID: ${{ github.event.inputs.owner_account_id }}
          ORACLE_ACCOUNT_ID: ${{ github.event.inputs.oracle_account_id }}
          RUN_INIT: ${{ github.event.inputs.run_init }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.NEAR_DEPLOY_PRIVATE_KEY }}
        run: |
          cat > deploy.mjs <<'SCRIPT_EOF'
          import fs from 'fs';
          import { Account, JsonRpcProvider, teraToGas } from 'near-api-js';

          async function main() {
            const network = process.env.NEAR_NETWORK;
            const contractAccountId = process.env.CONTRACT_ACCOUNT_ID;
            const nodeUrl = network === 'mainnet'
              ? 'https://rpc.mainnet.near.org'
              : 'https://rpc.testnet.near.org';

            const provider = new JsonRpcProvider({ url: nodeUrl });
            const account = new Account(contractAccountId, provider, process.env.DEPLOY_PRIVATE_KEY);

            const wasmPath = 'contract/target/wasm32-unknown-unknown/release/near_saboteur_pool.wasm';
            console.log(`Reading WASM from ${wasmPath} ...`);
            const wasm = fs.readFileSync(wasmPath);
            console.log(`WASM size: ${wasm.length} bytes`);

            console.log(`Deploying to ${contractAccountId} on ${network} ...`);
            const deployOutcome = await account.deployContract(wasm);
            // [SAFETY] near-api-js resolves deployContract's promise even
            // for some failure shapes rather than always throwing -
            // explicitly check the outcome's status so a bad deploy can
            // never again look like a success.
            if (!deployOutcome?.status || deployOutcome.status.Failure) {
              throw new Error(`Deploy did not succeed: ${JSON.stringify(deployOutcome?.status)}`);
            }
            console.log(`Deploy transaction hash: ${deployOutcome.transaction.hash}`);
            console.log(`View it at: https://${network === 'mainnet' ? '' : 'testnet.'}nearblocks.io/txns/${deployOutcome.transaction.hash}`);
            console.log('Deploy succeeded.');

            if (process.env.RUN_INIT === 'true') {
              console.log('Running one-time setup call (new) ...');
              const initOutcome = await account.callFunction({
                contractId: contractAccountId,
                methodName: 'new',
                args: {
                  owner_id: process.env.OWNER_ACCOUNT_ID,
                  oracle_id: process.env.ORACLE_ACCOUNT_ID,
                },
                gas: teraToGas('100'),
              });
              if (!initOutcome?.status || initOutcome.status.Failure) {
                throw new Error(`Setup call did not succeed: ${JSON.stringify(initOutcome?.status)}`);
              }
              console.log(`Setup call transaction hash: ${initOutcome.transaction.hash}`);
              console.log('Setup call succeeded.');
            } else {
              console.log('Skipping setup call (run_init was false) - this is correct for redeploying an already-initialized contract.');
            }
          }

          main().catch((err) => {
            console.error('DEPLOY FAILED:', err.message || err);
            process.exit(1);
          });
          SCRIPT_EOF
          node deploy.mjs

      - name: Done
        run: echo "Contract deployed to ${{ github.event.inputs.contract_account_id }} on ${{ github.event.inputs.network }}"
